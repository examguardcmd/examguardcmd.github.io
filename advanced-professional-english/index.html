<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advanced Professional English — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-blue:#005EA6;
    --brand-dark:#003B6F;
    --bg-light:#F8F9FA;
    --border-color:#E0E0E0;
    --text-main:#333333;
    --success-color:#2E7D32;
    --error-color:#C62828;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:#fff;color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);height:60px;background:#fff;z-index:110;flex-shrink:0;}
  .header-left{display:flex;align-items:center;height:100%;}
  .logo-container{padding:0 20px;height:100%;display:flex;align-items:center;border-right:1px solid var(--border-color);}
  .logo-container .brand-logo{height:34px;width:auto;display:block;}
  .logo-container span{font-weight:700;font-size:15px;letter-spacing:.3px;font-family:'Roboto Slab',serif;color:var(--brand-blue);display:none;}
  .subject-title{padding-left:24px;font-weight:500;font-size:16px;color:#222;}
  .header-right{padding-right:24px;font-size:13px;color:#666;}

  .navigation-bar{background:var(--bg-light);border-bottom:1px solid var(--border-color);padding:12px 40px;display:flex;align-items:center;overflow-x:auto;gap:8px;min-height:52px;flex-shrink:0;}
  .nav-bubble{position:relative;min-width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--brand-blue);color:var(--brand-blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s ease;flex-shrink:0;}
  .nav-bubble.active{background:var(--brand-blue);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand-blue);}
  .nav-bubble.answered{background:var(--brand-blue);color:#fff;}

  main{flex:1;display:flex;flex-direction:column;padding:30px 15% 40px 15%;overflow-y:auto;background:#fff;}
  .question-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .question-number{font-size:17px;font-weight:700;color:#111;}
  .marks-badge{background:#EAF2FA;color:var(--brand-blue);font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:.3px;}
  .question-text{font-size:17px;line-height:1.6;margin-bottom:6px;color:#222;font-weight:500;}
  .question-hint{font-size:13px;color:#777;margin-bottom:20px;}

  textarea{width:100%;min-height:160px;font-size:15px;line-height:1.6;padding:14px 16px;border:1px solid var(--border-color);border-radius:8px;font-family:'Roboto',sans-serif;color:var(--text-main);resize:vertical;}
  textarea:focus{outline:2px solid var(--brand-blue);outline-offset:1px;}

  .actions-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .btn-primary{background:var(--brand-blue);color:#fff;border:none;padding:12px 28px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{background:#fff;border:1px solid var(--border-color);color:#444;padding:11px 20px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-secondary:hover{border-color:#999;}

  .result-box{margin-top:24px;border:1px solid var(--border-color);border-radius:8px;display:flex;flex-direction:column;max-height:340px;display:none;}
  .result-score{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-light);border-bottom:1px solid var(--border-color);border-radius:8px 8px 0 0;flex-shrink:0;}
  .result-score .score-num{font-size:18px;font-weight:700;color:var(--brand-dark);}
  #resultRows{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .result-row{display:flex;align-items:flex-start;gap:14px;padding:12px 18px;border-bottom:1px dashed var(--border-color);}
  .result-row:last-child{border-bottom:none;}
  .result-icon{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;}
  .result-icon.hit{background:var(--success-color);}
  .result-icon.miss{background:var(--error-color);}
  .result-text .expected{font-size:14.5px;color:#222;font-weight:500;}
  .result-text .matched{font-size:12.5px;color:#888;margin-top:2px;}

  footer{border-top:1px solid var(--border-color);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 40px;flex-shrink:0;}
  .nav-btn{background:#fff;border:1px solid var(--border-color);color:#333;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .total-pill{font-size:13.5px;color:#555;}
  .total-pill b{color:var(--brand-dark);}
  .switch-mode-btn{background:none;border:1px solid var(--border-color);color:#555;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer;}
  .switch-mode-btn:hover{border-color:#999;}

  /* ===== Start screen (Khan Academy style) ===== */
  .start-screen{position:fixed;inset:0;background:#F7F8FA;z-index:200;overflow-y:auto;}
  .ks-topbar{background:#fff;border-bottom:1px solid var(--border-color);height:56px;display:flex;align-items:center;padding:0 28px;gap:10px;position:sticky;top:0;z-index:2;}
  .ks-logo{width:30px;height:30px;border-radius:8px;background:#1865F2;color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;}
  .ks-brand{font-weight:700;font-size:16px;color:#0B2149;}
  .ks-hero{background:linear-gradient(135deg,#0B2149 0%,#14366F 60%,#1B4B9B 100%);color:#fff;padding:44px 28px 92px;text-align:center;}
  .ks-hero h1{font-family:'Roboto Slab',serif;font-weight:500;font-size:34px;line-height:1.2;margin-bottom:10px;}
  .ks-hero p{font-size:16px;color:#C9D6EE;max-width:520px;margin:0 auto;}
  .ks-body{max-width:960px;margin:-56px auto 0;padding:0 24px 56px;}
  .ks-section{background:#fff;border:1px solid var(--border-color);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(11,33,73,.06);}
  .start-label{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#0B2149;margin:0 0 18px;}
  .start-label .step{width:26px;height:26px;border-radius:50%;background:#0B2149;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .start-label .hint{margin-left:auto;font-size:13px;font-weight:400;color:#6B7280;}

  .module-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
  .mod-btn{--c:#1865F2;position:relative;background:#fff;border:2px solid #DDE1E6;border-radius:12px;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
  .mod-btn:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,33,73,.10);}
  .mod-btn.selected{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent);}
  .mod-banner{height:84px;background:var(--c);display:flex;align-items:center;padding:0 18px;position:relative;overflow:hidden;}
  .mod-banner::after{content:"";position:absolute;right:-24px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);}
  .mod-banner::before{content:"";position:absolute;right:38px;bottom:-40px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.10);}
  .mod-num{font-family:'Roboto Slab',serif;font-size:40px;font-weight:500;color:#fff;line-height:1;position:relative;z-index:1;}
  .mod-num small{display:block;font-family:'Roboto',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.85;margin-bottom:4px;}
  .mod-check{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--c);display:none;align-items:center;justify-content:center;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .mod-btn.selected .mod-check{display:flex;}
  .mod-info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .mod-btn .mod-name{font-size:16px;font-weight:700;color:#0B2149;line-height:1.3;}
  .mod-btn .mod-desc{font-size:13px;color:#5F6B7A;line-height:1.45;}
  .mod-count{margin-top:auto;padding-top:8px;font-size:12px;font-weight:700;color:var(--c);}
  .mod-btn[data-mod="m1"]{--c:#1865F2;}
  .mod-btn[data-mod="m2"]{--c:#0D923F;}
  .mod-btn[data-mod="m3"]{--c:#9059FF;}
  .mod-btn[data-mod="m4"]{--c:#E0641B;}
  .mod-btn[data-mod="m5"]{--c:#D6336C;}

  .mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .mode-btn{background:#fff;border:2px solid #DDE1E6;border-radius:12px;padding:20px;cursor:pointer;display:flex;align-items:flex-start;gap:16px;text-align:left;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
  .mode-btn:hover{border-color:#1865F2;transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,101,242,.14);}
  .mode-icon{width:48px;height:48px;border-radius:12px;background:#E8F0FE;color:#1865F2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .mode-text{display:flex;flex-direction:column;gap:4px;flex:1;}
  .mode-title{font-size:17px;font-weight:700;color:#0B2149;}
  .mode-sub{font-size:13px;color:#5F6B7A;line-height:1.45;}
  .mode-go{margin-top:8px;font-size:13px;font-weight:700;color:#1865F2;}

  .mcq-options{display:none;flex-direction:column;gap:10px;}
  .mcq-option{border:1px solid var(--border-color);border-radius:8px;padding:12px 16px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s ease;}
  .mcq-option:hover{border-color:var(--brand-blue);}
  .mcq-option.selected{border-color:var(--brand-blue);background:#EAF2FA;}
  .mcq-option.disabled{cursor:default;}
  .mcq-option .opt-letter{min-width:24px;height:24px;border-radius:50%;border:1.5px solid #999;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#666;flex-shrink:0;}
  .mcq-option.selected .opt-letter{border-color:var(--brand-blue);background:var(--brand-blue);color:#fff;}
  .mcq-option.correct{border-color:var(--success-color);background:#EAF7EA;}
  .mcq-option.correct .opt-letter{background:var(--success-color);border-color:var(--success-color);color:#fff;}
  .mcq-option.incorrect{border-color:var(--error-color);background:#FDEAEA;}
  .mcq-option.incorrect .opt-letter{background:var(--error-color);border-color:var(--error-color);color:#fff;}
  .mcq-feedback{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;display:none;}
  .mcq-feedback.hit{background:#EAF7EA;color:var(--success-color);}
  .mcq-feedback.miss{background:#FDEAEA;color:var(--error-color);}


  .module-tabs{display:flex;gap:6px;margin-left:auto;margin-right:16px;}
  .module-tab{background:#fff;border:1.5px solid var(--border-color);color:var(--brand-dark);font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer;transition:all .15s ease;}
  .module-tab:hover{border-color:var(--brand-blue);}
  .module-tab.active{background:var(--brand-blue);border-color:var(--brand-blue);color:#fff;}
  .header-actions{display:flex;align-items:center;gap:8px;padding-right:20px;}
  .mode-chip{font-size:12px;font-weight:700;color:var(--brand-blue);background:#EAF2FA;padding:4px 10px;border-radius:12px;}

  @media (max-width: 700px){
    .ks-hero{padding:32px 18px 80px;}
    .ks-hero h1{font-size:25px;}
    .ks-body{padding:0 14px 40px;}
    .ks-section{padding:18px 14px;}
    .module-picker{grid-template-columns:1fr;}
    .mode-buttons{grid-template-columns:1fr;}
    header{height:auto;flex-wrap:wrap;padding:10px 14px;}
    .header-left{flex-wrap:wrap;}
    .logo-container{padding:0 12px 0 0;border-right:none;height:auto;}
    .subject-title{padding-left:0;font-size:14px;}
    .header-right{display:none;}
    .module-tabs{margin:8px 0 0 0;width:100%;}
    .module-tab{flex:1;}
    .header-actions{padding-right:0;margin-top:8px;width:100%;justify-content:space-between;}
    .navigation-bar{padding:10px 14px;}
    main{padding:20px 16px 30px 16px;}
    .question-text{font-size:15.5px;}
    textarea{min-height:130px;font-size:14px;}
    .actions-row{flex-wrap:wrap;}
    .btn-primary,.btn-secondary{flex:1;text-align:center;padding:12px 14px;}
    .result-box{max-height:none;}
    #resultRows{max-height:45vh;}
    footer{padding:12px 16px;flex-wrap:wrap;gap:10px;justify-content:center;}
    .total-pill{order:3;width:100%;text-align:center;}
    .nav-btn{flex:1;padding:10px 12px;font-size:13.5px;}
  }

  /* ===== Mobile / responsive fixes ===== */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit;}
  .question-text,.mcq-option span,.result-text{overflow-wrap:anywhere;}
  .module-tab,.nav-btn,.switch-mode-btn,.mode-chip{white-space:nowrap;}
  .module-tabs{flex-wrap:nowrap;}

  @media (max-width:1024px){
    main{padding:26px 6% 32px;}
    .navigation-bar{padding:12px 24px;}
    footer{padding-left:24px;padding-right:24px;}
  }

  /* Phones: let the PAGE scroll (no fixed-height shell), sticky footer */
  @media (max-width:700px){
    html,body{height:auto;min-height:100%;}
    body{display:block;overflow:visible;overscroll-behavior-y:none;}
    #appScreen{flex:none !important;min-height:100vh;min-height:100dvh;}

    .ks-topbar{padding:0 max(16px,env(safe-area-inset-left));}

    header{display:block;height:auto;flex-wrap:nowrap;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;}
    .header-left{display:flex;flex-wrap:nowrap;align-items:center;height:auto;width:100%;min-width:0;}
    .logo-container{height:auto;padding:0 10px 0 0;border-right:none;flex-shrink:0;}
    .logo-container .brand-logo{height:28px;}
    .subject-title{padding-left:0;font-size:13.5px;line-height:1.3;min-width:0;flex:1;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .header-right{display:none;}

    .module-tabs{display:flex;gap:6px;width:100%;margin:10px 0 0;padding:0 0 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
    .module-tabs::-webkit-scrollbar{display:none;}
    .module-tab{flex:0 0 auto;padding:8px 14px;font-size:13px;line-height:1.2;}

    .header-actions{display:flex;align-items:center;gap:6px;width:100%;margin:10px 0 0;padding:0;justify-content:flex-start;}
    .mode-chip{margin-right:auto;}
    .switch-mode-btn{padding:8px 12px;font-size:12.5px;min-height:36px;}

    .navigation-bar{flex:none;padding:10px 14px;min-height:54px;gap:8px;-webkit-overflow-scrolling:touch;}
    .nav-bubble{min-width:32px;height:32px;}

    main{flex:none;overflow:visible;padding:18px 14px 24px;}
    .question-meta{gap:10px;}
    .question-number{font-size:15px;}
    .question-text{font-size:16px;}
    textarea{font-size:16px;min-height:140px;padding:12px;}   /* 16px prevents iOS zoom */
    .mcq-option{padding:14px;font-size:15px;min-height:48px;}
    .actions-row{gap:8px;flex-wrap:nowrap;}
    .btn-primary,.btn-secondary{flex:1;min-height:46px;font-size:15px;padding:12px 10px;}
    .result-box{max-height:none;}
    #resultRows{max-height:none;overflow:visible;}
    .result-row{padding:12px;gap:10px;}
    .result-score{padding:12px;}

    footer{position:sticky;bottom:0;z-index:50;flex-wrap:nowrap;gap:8px;justify-content:space-between;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.05);}
    .total-pill{order:0;width:auto;flex:1;text-align:center;font-size:12.5px;white-space:nowrap;}
    .nav-btn{flex:0 0 auto;min-height:44px;padding:10px 14px;font-size:14px;}

    .mode-btn{padding:16px;gap:12px;}
    .mod-banner{height:72px;}
    .start-label{font-size:16px;flex-wrap:wrap;}
  }

  @media (max-width:380px){
    .nav-btn{padding:10px 10px;font-size:13px;}
    .ks-hero h1{font-size:22px;}
  }
  @media (hover:none){
    .mod-btn:hover,.mode-btn:hover{transform:none;}
  }
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
  <div class="ks-topbar"><div class="ks-logo">APE</div><div class="ks-brand">Advanced Professional English</div></div>
  <div class="ks-hero">
    <h1>What would you like to practise today?</h1>
    <p>Pick a module, then choose how you'd like to study.</p>
  </div>
  <div class="ks-body">
    <div class="ks-section">
      <div class="start-label"><span class="step">1</span>Choose a module</div>
      <div class="module-picker" id="modulePicker">
        <button class="mod-btn selected" data-mod="m1">
          <span class="mod-banner"><span class="mod-num"><small>Module</small>1</span>
            <span class="mod-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
          <span class="mod-info">
            <span class="mod-name">Techniques for Interpersonal Skills</span>
            <span class="mod-desc">Decision frameworks, biases &amp; fallacies, emotional intelligence, group development, conflict resolution</span>
            <span class="mod-count" data-count="m1"></span>
          </span>
        </button>
        <button class="mod-btn" data-mod="m2">
          <span class="mod-banner"><span class="mod-num"><small>Module</small>2</span>
            <span class="mod-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
          <span class="mod-info">
            <span class="mod-name">Discussion &amp; Cross-Cultural Communication</span>
            <span class="mod-desc">Discussion techniques, the 3 Cs of cross cultural communication, CALM &amp; STEADY crisis frameworks</span>
            <span class="mod-count" data-count="m2"></span>
          </span>
        </button>
        <button class="mod-btn" data-mod="m3">
          <span class="mod-banner"><span class="mod-num"><small>Module</small>3</span>
            <span class="mod-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
          <span class="mod-info">
            <span class="mod-name">Presentations &amp; Persuasion</span>
            <span class="mod-desc">Good presentations, non-verbal communication, Aristotle's modes of persuasion</span>
            <span class="mod-count" data-count="m3"></span>
          </span>
        </button>
        <button class="mod-btn" data-mod="m4">
          <span class="mod-banner"><span class="mod-num"><small>Module</small>4</span>
            <span class="mod-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
          <span class="mod-info">
            <span class="mod-name">Interviewing</span>
            <span class="mod-desc">Behavioural &amp; situational interviews, the STAR and SCORE methods</span>
            <span class="mod-count" data-count="m4"></span>
          </span>
        </button>
        <button class="mod-btn" data-mod="m5">
          <span class="mod-banner"><span class="mod-num"><small>Module</small>5</span>
            <span class="mod-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></span>
          <span class="mod-info">
            <span class="mod-name">Goal Setting</span>
            <span class="mod-desc">Goal-setting frameworks, OKR and SMART goals</span>
            <span class="mod-count" data-count="m5"></span>
          </span>
        </button>
      </div>
    </div>

    <div class="ks-section">
      <div class="start-label"><span class="step">2</span>Choose how to practise</div>
      <div class="mode-buttons">
        <button class="mode-btn" id="frqModeBtn">
          <span class="mode-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
          <span class="mode-text">
            <span class="mode-title">Free Response</span>
            <span class="mode-sub">Type out each answer yourself. Capitalization and small typos don't matter.</span>
            <span class="mode-go">Start →</span>
          </span>
        </button>
        <button class="mode-btn" id="mcqModeBtn">

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffleMCQOptions(q){
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.correct }));
  const shuffled = shuffle(tagged);
  return { type:'mcq', text:q.text, options: shuffled.map(o => o.opt), correct: shuffled.findIndex(o => o.isCorrect) };
}

function buildFRQQuestions(mod){
  return shuffle(MODULES[mod].frq);

function buildMCQQuestions(mod){
  return shuffle(MODULES[mod].mcq.map(shuffleMCQOptions));

function normalize(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function isFuzzyMatch(userText, expected){
  const a = normalize(userText), b = normalize(expected);
  if (!a) return false;
  if (a === b) return true;
  const threshold = Math.max(1, Math.floor(b.length * 0.25));
  return levenshtein(a, b) <= threshold;
}

function buildNav(){
  DOM.navBar.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('div');
    b.className = 'nav-bubble';
    b.innerText = idx + 1;
    b.addEventListener('click', () => { captureText(); activeIdx = idx; saveSession(); render(); });
    DOM.navBar.appendChild(b);
  });
}

function updateNav(){
  const bubbles = DOM.navBar.querySelectorAll('.nav-bubble');
  bubbles.forEach((b, idx) => {
    b.classList.remove('active','answered');
    if (idx === activeIdx) b.classList.add('active');
    if (state[idx].checked) b.classList.add('answered');
  });
}

function updateTotals(){
  const scored = state.reduce((sum, s) => sum + s.score, 0);
  const max = questions.reduce((sum, q) => sum + q.maxMarks, 0);
  DOM.totalScore.innerText = scored;
  DOM.totalMax.innerText = max;
}

function renderMCQOptions(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  const letters = ['A','B','C','D','E','F'];

  DOM.mcqOptions.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const row = document.createElement('div');
    row.className = 'mcq-option';
    if (s.selected === idx) row.classList.add('selected');
    if (s.checked){
      row.classList.add('disabled');
      if (idx === q.correct) row.classList.add('correct');
      else if (idx === s.selected) row.classList.add('incorrect');
    } else {
      row.addEventListener('click', () => { s.selected = idx; renderMCQOptions(); });
    }
    row.innerHTML = '<span class="opt-letter">' + letters[idx] + '</span><span>' + opt + '</span>';
    DOM.mcqOptions.appendChild(row);
  });

  if (s.checked){
    const correct = s.selected === q.correct;
    DOM.mcqFeedback.style.display = 'block';
    DOM.mcqFeedback.className = 'mcq-feedback ' + (correct ? 'hit' : 'miss');
    DOM.mcqFeedback.innerText = (correct ? 'Correct! ' : 'Incorrect — correct answer: ' + q.options[q.correct] + '. ') + '(' + s.score + '/1)';
  } else {
    DOM.mcqFeedback.style.display = 'none';
  }
}

function render(){
  const q = questions[activeIdx];
  const s = state[activeIdx];

  DOM.qNum.innerText = 'Question ' + (activeIdx + 1) + ' of ' + questions.length;
  DOM.marksBadge.innerText = q.maxMarks + (q.maxMarks === 1 ? ' mark' : ' marks');
  DOM.qText.innerText = q.text;

  if (q.type === 'mcq'){
    DOM.frqInputArea.style.display = 'none';
    DOM.mcqOptions.style.display = 'flex';
    DOM.checkBtn.innerText = 'Check Answer';
    DOM.resultBox.style.display = 'none';
    renderMCQOptions();
  } else {
    DOM.frqInputArea.style.display = 'block';
    DOM.mcqOptions.style.display = 'none';
    DOM.mcqFeedback.style.display = 'none';
    DOM.checkBtn.innerText = 'Check Answer';
    DOM.answerBox.value = s.text;
    DOM.answerBox.placeholder = q.type === 'numeric' ? 'Type your numeric answer...' : 'Type each answer on its own line...';
    document.getElementById('qHint').innerText = q.type === 'numeric'
      ? 'Enter a single number as your answer.'
      : 'Type one answer per line, in any order. Then check your answers.';

    if (s.checked){
      showResults(false);
    } else {
      DOM.resultBox.style.display = 'none';
    }
  }

  DOM.prevBtn.disabled = (activeIdx === 0);
  DOM.nextBtn.disabled = (activeIdx === questions.length - 1);

  updateNav();
  updateTotals();
}

function checkMCQAnswer(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  if (s.selected === undefined || s.selected === null) return;
  s.checked = true;
  s.score = (s.selected === q.correct) ? 1 : 0;
  renderMCQOptions();
  updateNav();
  updateTotals();
}

function checkAnswer(){
  const q = questions[activeIdx];
  if (q.type === 'mcq'){ checkMCQAnswer(); return; }

  const s = state[activeIdx];
  s.text = DOM.answerBox.value;

  if (q.type === 'numeric'){
    const raw = s.text.trim();
    const userNum = parseInt(raw.replace(/[^\d-]/g, ''), 10);
    const expectedNum = parseInt(q.answers[0], 10);
    const correct = raw.length > 0 && !isNaN(userNum) && userNum === expectedNum;
    s.score = correct ? 1 : 0;
    s.checked = true;
    s.matches = [correct ? raw : null];
    showResults(true);
    updateNav();
    updateTotals();
    return;
  }

  const lines = s.text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const usedLine = new Array(lines.length).fill(false);
  const matches = q.answers.map(() => null);

  const pairs = [];
  q.answers.forEach((expected, qi) => {
    const b = normalize(expected);
    const threshold = Math.max(1, Math.floor(b.length * 0.25));
    lines.forEach((line, li) => {
      const dist = levenshtein(normalize(line), b);
      if (dist <= threshold) pairs.push({ qi, li, dist });
    });
  });
  pairs.sort((x, y) => x.dist - y.dist);
  pairs.forEach(p => {
    if (matches[p.qi] === null && !usedLine[p.li]){
      matches[p.qi] = lines[p.li];
      usedLine[p.li] = true;
    }
  });

  s.score = matches.filter(m => m !== null).length;
  s.checked = true;
  s.matches = matches;

  showResults(true);
  updateNav();
  updateTotals();
}

function showResults(){
  const q = questions[activeIdx];
  const s = state[activeIdx];

  DOM.resultBox.style.display = 'flex';
  DOM.scoreNum.innerText = s.score + ' / ' + q.answers.length;
  DOM.resultRows.innerHTML = '';

  q.answers.forEach((expected, i) => {
    const matched = s.matches ? s.matches[i] : null;
    const row = document.createElement('div');
    row.className = 'result-row';
    const icon = document.createElement('div');
    icon.className = 'result-icon ' + (matched ? 'hit' : 'miss');
    icon.innerText = matched ? '✓' : '✕';
    const text = document.createElement('div');
    text.className = 'result-text';
    text.innerHTML = '<div class="expected">' + expected + '</div>' +
      (matched ? '<div class="matched">You wrote: "' + matched + '"</div>' : '<div class="matched">Not found in your answers</div>');
    row.appendChild(icon);
    row.appendChild(text);
    DOM.resultRows.appendChild(row);
  });
}

DOM.checkBtn.addEventListener('click', checkAnswer);
DOM.clearBtn.addEventListener('click', () => {
  const s = state[activeIdx];
  s.text = ''; s.checked = false; s.score = 0; s.matches = null; s.selected = undefined;
  render();
});

DOM.prevBtn.addEventListener('click', () => { if (activeIdx > 0){ captureText(); activeIdx--; saveSession(); render(); } });
DOM.nextBtn.addEventListener('click', () => { if (activeIdx < questions.length - 1){ captureText(); activeIdx++; saveSession(); render(); } });

document.addEventListener('keydown', (e) => {
  if (document.activeElement === DOM.answerBox) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); DOM.prevBtn.click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); DOM.nextBtn.click(); }
});
</script>
</body>
