<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Thinking — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-blue:#005EA6;
    --brand-dark:#003B6F;
    --bg-light:#F8F9FA;
    --border-color:#E0E0E0;
    --text-main:#333333;
    --success-color:#2E7D32;
    --error-color:#C62828;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased;}
  body{background:#fff;color:var(--text-main);display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);height:60px;background:#fff;z-index:110;flex-shrink:0;}
  .header-left{display:flex;align-items:center;height:100%;}
  .logo-container{padding:0 20px;height:100%;display:flex;align-items:center;border-right:1px solid var(--border-color);}
  .logo-container .brand-logo{height:34px;width:auto;display:block;}
  .logo-container span{font-weight:700;font-size:15px;letter-spacing:.3px;font-family:'Roboto Slab',serif;color:var(--brand-blue);display:none;}
  .subject-title{padding-left:24px;font-weight:500;font-size:16px;color:#222;}
  .header-right{padding-right:24px;font-size:13px;color:#666;}

  .navigation-bar{background:var(--bg-light);border-bottom:1px solid var(--border-color);padding:12px 40px;display:flex;align-items:center;overflow-x:auto;gap:8px;min-height:52px;flex-shrink:0;}
  .nav-bubble{position:relative;min-width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid var(--brand-blue);color:var(--brand-blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;user-select:none;transition:all .15s ease;flex-shrink:0;}
  .nav-bubble.active{background:var(--brand-blue);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand-blue);}
  .nav-bubble.answered{background:var(--brand-blue);color:#fff;}

  main{flex:1;display:flex;flex-direction:column;padding:30px 15% 40px 15%;overflow-y:auto;background:#fff;}
  .question-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .question-number{font-size:17px;font-weight:700;color:#111;}
  .marks-badge{background:#EAF2FA;color:var(--brand-blue);font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:.3px;}
  .question-text{font-size:17px;line-height:1.6;margin-bottom:6px;color:#222;font-weight:500;}
  .question-hint{font-size:13px;color:#777;margin-bottom:20px;}

  textarea{width:100%;min-height:160px;font-size:15px;line-height:1.6;padding:14px 16px;border:1px solid var(--border-color);border-radius:8px;font-family:'Roboto',sans-serif;color:var(--text-main);resize:vertical;}
  textarea:focus{outline:2px solid var(--brand-blue);outline-offset:1px;}

  .actions-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
  .btn-primary{background:var(--brand-blue);color:#fff;border:none;padding:12px 28px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-primary:hover{background:var(--brand-dark);}
  .btn-secondary{background:#fff;border:1px solid var(--border-color);color:#444;padding:11px 20px;font-size:14px;font-weight:500;border-radius:6px;cursor:pointer;}
  .btn-secondary:hover{border-color:#999;}

  .result-box{margin-top:24px;border:1px solid var(--border-color);border-radius:8px;display:flex;flex-direction:column;max-height:340px;display:none;}
  .result-score{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--bg-light);border-bottom:1px solid var(--border-color);border-radius:8px 8px 0 0;flex-shrink:0;}
  .result-score .score-num{font-size:18px;font-weight:700;color:var(--brand-dark);}
  #resultRows{overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .result-row{display:flex;align-items:flex-start;gap:14px;padding:12px 18px;border-bottom:1px dashed var(--border-color);}
  .result-row:last-child{border-bottom:none;}
  .result-icon{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px;}
  .result-icon.hit{background:var(--success-color);}
  .result-icon.miss{background:var(--error-color);}
  .result-text .expected{font-size:14.5px;color:#222;font-weight:500;}
  .result-text .matched{font-size:12.5px;color:#888;margin-top:2px;}

  footer{border-top:1px solid var(--border-color);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 40px;flex-shrink:0;}
  .nav-btn{background:#fff;border:1px solid var(--border-color);color:#333;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed;}
  .total-pill{font-size:13.5px;color:#555;}
  .total-pill b{color:var(--brand-dark);}
  .switch-mode-btn{background:none;border:1px solid var(--border-color);color:#555;font-size:12.5px;padding:6px 12px;border-radius:6px;cursor:pointer;}
  .switch-mode-btn:hover{border-color:#999;}

  .start-screen{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .start-card{max-width:560px;width:100%;text-align:center;}
  .start-card h1{font-family:'Roboto Slab',serif;font-size:24px;color:var(--brand-dark);margin-bottom:8px;}
  .start-card p{color:#666;font-size:14.5px;margin-bottom:28px;}
  .mode-buttons{display:flex;gap:16px;}
  .mode-btn{flex:1;background:#fff;border:1.5px solid var(--border-color);border-radius:10px;padding:22px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:all .15s ease;}
  .mode-btn:hover{border-color:var(--brand-blue);box-shadow:0 2px 10px rgba(0,94,166,0.12);}
  .mode-title{font-size:16px;font-weight:700;color:var(--brand-dark);}
  .mode-sub{font-size:12.5px;color:#777;line-height:1.4;}

  .mcq-options{display:none;flex-direction:column;gap:10px;}
  .mcq-option{border:1px solid var(--border-color);border-radius:8px;padding:12px 16px;font-size:14.5px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s ease;}
  .mcq-option:hover{border-color:var(--brand-blue);}
  .mcq-option.selected{border-color:var(--brand-blue);background:#EAF2FA;}
  .mcq-option.disabled{cursor:default;}
  .mcq-option .opt-letter{min-width:24px;height:24px;border-radius:50%;border:1.5px solid #999;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#666;flex-shrink:0;}
  .mcq-option.selected .opt-letter{border-color:var(--brand-blue);background:var(--brand-blue);color:#fff;}
  .mcq-option.correct{border-color:var(--success-color);background:#EAF7EA;}
  .mcq-option.correct .opt-letter{background:var(--success-color);border-color:var(--success-color);color:#fff;}
  .mcq-option.incorrect{border-color:var(--error-color);background:#FDEAEA;}
  .mcq-option.incorrect .opt-letter{background:var(--error-color);border-color:var(--error-color);color:#fff;}
  .mcq-feedback{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:14px;font-weight:500;display:none;}
  .mcq-feedback.hit{background:#EAF7EA;color:var(--success-color);}
  .mcq-feedback.miss{background:#FDEAEA;color:var(--error-color);}

  @media (max-width: 700px){
    .mode-buttons{flex-direction:column;}
    .start-card h1{font-size:20px;}
    .start-card p{font-size:13.5px;margin-bottom:20px;}
    .mode-btn{padding:18px 14px;}

    header{height:auto;min-height:52px;flex-wrap:nowrap;padding:8px 10px;}
    .header-left{flex:1;min-width:0;flex-wrap:nowrap;overflow:hidden;}
    .logo-container{padding:0 8px 0 0;border-right:none;height:auto;flex-shrink:0;}
    .logo-container .brand-logo{height:26px;}
    .logo-container span{font-size:12.5px;}
    .subject-title{padding-left:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}

    .navigation-bar{padding:8px 10px;gap:6px;min-height:44px;}
    .nav-bubble{min-width:30px;height:30px;font-size:12px;}

    main{padding:18px 14px 24px 14px;}
    .question-meta{margin-bottom:10px;}
    .question-number{font-size:15px;}
    .question-text{font-size:15.5px;line-height:1.5;}
    .question-hint{font-size:12px;margin-bottom:14px;}
    textarea{min-height:120px;font-size:16px;padding:12px 14px;}

    .mcq-options{gap:8px;}
    .mcq-option{padding:12px 12px;font-size:14px;line-height:1.4;gap:10px;align-items:flex-start;border-radius:10px;}
    .mcq-option .opt-letter{margin-top:1px;min-width:22px;height:22px;font-size:11px;}
    .mcq-feedback{font-size:13.5px;padding:10px 14px;}

    .actions-row{flex-wrap:wrap;margin-top:14px;gap:10px;}
    .btn-primary,.btn-secondary{flex:1;text-align:center;padding:13px 14px;font-size:14.5px;}
    .result-box{max-height:none;}
    #resultRows{max-height:42vh;}
    .result-row{padding:10px 14px;gap:10px;}
    .result-text .expected{font-size:14px;}

    footer{padding:10px 14px;flex-wrap:wrap;gap:8px;justify-content:center;}
    .total-pill{order:3;width:100%;text-align:center;font-size:13px;}
    .nav-btn{flex:1;padding:11px 10px;font-size:13.5px;}

    .switch-mode-btn.mobile-compact{width:34px;height:34px;padding:0;border-radius:50%;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  }
</style>
</head>
<body>

<div class="start-screen" id="startScreen">
  <div class="start-card">
    <h1>Design Thinking — Practice</h1>
    <p>Choose how you'd like to practice this round</p>
    <div class="mode-buttons">
      <button class="mode-btn" id="frqModeBtn">
        <span class="mode-title">Free Response</span>
        <span class="mode-sub">Type out each answer yourself. Capitalization and small typos don't matter.</span>
      </button>
      <button class="mode-btn" id="mcqModeBtn">
        <span class="mode-title">Multiple Choice</span>
        <span class="mode-sub">Pick from 4 options, including ordering and sequencing questions.</span>
      </button>
    </div>
  </div>
</div>

<div id="appScreen" style="display:none;flex-direction:column;flex:1;min-height:0;">

<header>
  <div class="header-left">
    <div class="logo-container">
      <img class="brand-logo" id="brand-logo-img" src="examguard-logo.png" alt="Design Thinking Practice"
           onerror="if(!this.dataset.triedJpg){this.dataset.triedJpg='1';this.src='examguard-logo.jpg';}else{this.style.display='none';document.getElementById('brand-logo-fallback').style.display='block';}">
      <span class="brand-logo-fallback" id="brand-logo-fallback">DT PRACTICE</span>
    </div>
    <div class="subject-title">Design Thinking — Practice</div>
  </div>
  <button class="switch-mode-btn" id="switchModeBtn">Switch Mode</button>
</header>

<div class="navigation-bar" id="navBar"></div>

<main>
  <div class="question-meta">
    <div class="question-number" id="qNum"></div>
    <div class="marks-badge" id="marksBadge"></div>
  </div>
  <div class="question-text" id="qText"></div>

  <div id="frqInputArea">
    <div class="question-hint" id="qHint">Type one answer per line, in any order. Then check your answers.</div>
    <textarea id="answerBox" placeholder="Type each answer on its own line..."></textarea>
  </div>

  <div class="mcq-options" id="mcqOptions"></div>
  <div class="mcq-feedback" id="mcqFeedback"></div>

  <div class="actions-row">
    <button class="btn-primary" id="checkBtn">Check Answer</button>
    <button class="btn-secondary" id="clearBtn">Clear</button>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-score">
      <span>Score</span>
      <span class="score-num" id="scoreNum"></span>
    </div>
    <div id="resultRows"></div>
  </div>
</main>

<footer>
  <button class="nav-btn" id="prevBtn">← Previous</button>
  <div class="total-pill">Overall: <b id="totalScore">0</b> / <b id="totalMax">0</b></div>
  <button class="nav-btn" id="nextBtn">Next →</button>
</footer>

</div>

<script>
const FRQ_BANK = [
  { text:"What are the 5 types of low fidelity prototypes?", answers:["Sketches","Paper Prototype","Lego Prototype","Digital Wireframe","Wizard of Oz Prototype"] },
  { text:"What are the 3 stages of digital prototyping?", answers:["Digital Wireframe","Mockup","Operational Prototype"] },
  { text:"What are 5 stages of Google Design Sprint?", answers:["Understand","Sketch","Decide","Prototype","Test"] },
  { text:"What are the 3 networks of creative cognition?", answers:["Executive Attention Network","Imagination Network","Salience Network"] },
  { text:"What are the stages of Graham Wallas's framework?", answers:["Preparation","Incubation","Illumination","Verification"] },
  { text:"What are the 6 principles of Systematic Innovative Thinking?", answers:["Cognitive Fixedness","Path of Most Resistance","Closed World","Existing Situation","Virtual Product","Function follows Form"] },
  { text:"What are the 5 main SIT thinking tools?", answers:["Subtraction","Division","Multiplication","Task Unification","Attribute Dependency"] },
  { text:"What are the 3 main methods used for structured problem solving during the Ideation phase of the Design Thinking process?", answers:["Morphological Box","SCAMPER","Synectics"] },
  { text:"What are the frameworks used during the convergent (perspective) phase of Ideation?", answers:["Six Thinking Hats","Walt Disney Method","Delphi Method"] },
  { text:"What are the frameworks used during the divergent (idea generation) phase of Ideation?", answers:["Brainstorming","Brainwriting (6-3-5)","Mindmapping","Lotus Blossom"] },
  { text:"What are the 6 feelings associated with the \"Six Thinking Hats\" framework?", answers:["Black Hat - Skeptic","White Hat - Analytical","Blue Hat - Manager","Green Hat - Creativity","Red Hat - Feelings","Yellow Hat - Optimism"] },
  { text:"What are the 3 thinkers in the Walt Disney method?", answers:["Dreamer","Realist","Critic"] },
  { text:"What are the 4 analogy types used in Synectics?", answers:["Direct","Personal","Symbolic","Fantasy"] },
  { text:"What are the 7 steps in the SCAMPER method?", answers:["Substitute","Combine","Adapt","Modify","Put to another use","Eliminate","Reverse"] }
];

function randInt(min, max){
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function genMorphBoxQuestion(){
  const params = randInt(2, 6);
  const variations = randInt(2, 7);
  const answer = Math.pow(variations, params);
  return {
    type: 'numeric',
    text: 'A design team has implemented a Morphological Box for designing a system with ' + params + ' parameters. Each parameter has ' + variations + ' distinct variations. How many possible designs can be created?',
    answers: [String(answer)]
  };
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const MCQ_BANK_RAW = [
  { text:"What is the correct order of stages in digital prototyping?", options:["Digital Wireframe → Mockup → Operational Prototype","Mockup → Operational Prototype → Digital Wireframe","Operational Prototype → Digital Wireframe → Mockup","Digital Wireframe → Operational Prototype → Mockup"], correct:0 },
  { text:"What is the correct order of the Google Design Sprint stages?", options:["Understand → Sketch → Decide → Prototype → Test","Sketch → Understand → Prototype → Decide → Test","Understand → Decide → Sketch → Test → Prototype","Sketch → Decide → Understand → Test → Prototype"], correct:0 },
  { text:"Which of the following is NOT one of the 3 networks of creative cognition?", options:["Executive Attention Network","Working Memory Network","Imagination Network","Salience Network"], correct:1 },
  { text:"What is the correct order of stages in Graham Wallas's framework?", options:["Preparation → Incubation → Illumination → Verification","Incubation → Preparation → Verification → Illumination","Preparation → Illumination → Incubation → Verification","Illumination → Preparation → Incubation → Verification"], correct:0 },
  { text:"Which of the following is one of the 6 principles of Systematic Innovative Thinking (SIT)?", options:["Closed World","Open Brainstorming","User Empathy","Rapid Prototyping"], correct:0 },
  { text:"Which of these is NOT one of the 5 main SIT thinking tools?", options:["Subtraction","Division","Combination","Multiplication"], correct:2 },
  { text:"Which method is used for structured problem solving during the Ideation phase (rather than divergent idea generation)?", options:["SCAMPER","Brainstorming","Mindmapping","Lotus Blossom"], correct:0 },
  { text:"Which framework belongs to the convergent (perspective) phase of Ideation?", options:["Six Thinking Hats","Brainwriting (6-3-5)","Mindmapping","Lotus Blossom"], correct:0 },
  { text:"Which framework belongs to the divergent (idea generation) phase of Ideation?", options:["Brainstorming","Delphi Method","Walt Disney Method","Six Thinking Hats"], correct:0 },
  { text:"In the Six Thinking Hats framework, which hat represents feelings and emotions?", options:["Red Hat","Black Hat","Yellow Hat","Blue Hat"], correct:0 },
  { text:"What is the correct order of thinkers in the Walt Disney Method?", options:["Dreamer → Realist → Critic","Critic → Dreamer → Realist","Realist → Critic → Dreamer","Dreamer → Critic → Realist"], correct:0 },
  { text:"Which of the following is NOT one of the 4 analogy types used in Synectics?", options:["Direct","Personal","Symbolic","Contextual"], correct:3 },
  { text:"What is the correct order of the first four SCAMPER steps?", options:["Substitute → Combine → Adapt → Modify","Combine → Substitute → Modify → Adapt","Adapt → Substitute → Combine → Modify","Substitute → Adapt → Combine → Modify"], correct:0 },
  { text:"Which of the following is a low fidelity prototype type?", options:["Wizard of Oz Prototype","Mockup","Operational Prototype","High-fidelity Prototype"], correct:0 }
];

function shuffleMCQOptions(q){
  const tagged = q.options.map((opt, i) => ({ opt, isCorrect: i === q.correct }));
  const shuffled = shuffle(tagged);
  return { type:'mcq', text:q.text, options: shuffled.map(o => o.opt), correct: shuffled.findIndex(o => o.isCorrect) };
}

function genMorphBoxMCQ(){
  const params = randInt(2, 5);
  const variations = randInt(2, 6);
  const correctAnswer = Math.pow(variations, params);
  const distractorSet = new Set([
    params * variations,
    Math.pow(variations, params > 2 ? params - 1 : params + 1),
    Math.pow(variations + 1, params)
  ]);
  let opts = [correctAnswer];
  distractorSet.forEach(d => { if (d !== correctAnswer && !opts.includes(d) && d > 0) opts.push(d); });
  while (opts.length < 4){
    const fake = correctAnswer + randInt(1, 12) * (Math.random() < 0.5 ? -1 : 1);
    if (fake > 0 && !opts.includes(fake)) opts.push(fake);
  }
  opts = shuffle(opts.slice(0, 4));
  return {
    type:'mcq',
    text: 'A design team has implemented a Morphological Box for designing a system with ' + params + ' parameters. Each parameter has ' + variations + ' distinct variations. How many possible designs can be created?',
    options: opts.map(String),
    correct: opts.indexOf(correctAnswer)
  };
}

function buildFRQQuestions(){
  return shuffle([...FRQ_BANK, genMorphBoxQuestion()]);
}

function buildMCQQuestions(){
  return shuffle([...MCQ_BANK_RAW.map(shuffleMCQOptions), genMorphBoxMCQ()]);
}

let mode = null;
let questions = [];
let state = [];
let activeIdx = 0;

const DOM = {
  navBar: document.getElementById('navBar'),
  qNum: document.getElementById('qNum'),
  marksBadge: document.getElementById('marksBadge'),
  qText: document.getElementById('qText'),
  answerBox: document.getElementById('answerBox'),
  checkBtn: document.getElementById('checkBtn'),
  clearBtn: document.getElementById('clearBtn'),
  resultBox: document.getElementById('resultBox'),
  scoreNum: document.getElementById('scoreNum'),
  resultRows: document.getElementById('resultRows'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  totalScore: document.getElementById('totalScore'),
  totalMax: document.getElementById('totalMax'),
  frqInputArea: document.getElementById('frqInputArea'),
  mcqOptions: document.getElementById('mcqOptions'),
  mcqFeedback: document.getElementById('mcqFeedback'),
  startScreen: document.getElementById('startScreen'),
  appScreen: document.getElementById('appScreen')
};

function startQuiz(selectedMode){
  mode = selectedMode;
  questions = (mode === 'frq' ? buildFRQQuestions() : buildMCQQuestions())
    .map(q => Object.assign({}, q, { maxMarks: q.type === 'mcq' ? 1 : (q.type === 'numeric' ? 1 : q.answers.length) }));
  state = questions.map(() => ({ text:"", checked:false, score:0, selected: undefined, matches: null }));
  activeIdx = 0;
  DOM.startScreen.style.display = 'none';
  DOM.appScreen.style.display = 'flex';
  buildNav();
  render();
}

document.getElementById('frqModeBtn').addEventListener('click', () => startQuiz('frq'));
document.getElementById('mcqModeBtn').addEventListener('click', () => startQuiz('mcq'));
document.getElementById('switchModeBtn').addEventListener('click', () => {
  DOM.appScreen.style.display = 'none';
  DOM.startScreen.style.display = 'flex';
});

const mobileQuery = window.matchMedia('(max-width: 700px)');
function updateSwitchModeButton(){
  const btn = document.getElementById('switchModeBtn');
  if (mobileQuery.matches){
    btn.textContent = '⇄';
    btn.classList.add('mobile-compact');
    btn.setAttribute('aria-label', 'Switch Mode');
    btn.title = 'Switch Mode';
  } else {
    btn.textContent = 'Switch Mode';
    btn.classList.remove('mobile-compact');
    btn.removeAttribute('aria-label');
    btn.removeAttribute('title');
  }
}
mobileQuery.addEventListener('change', updateSwitchModeButton);
updateSwitchModeButton();

function normalize(s){
  return s.toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++){
    for (let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}

function isFuzzyMatch(userText, expected){
  const a = normalize(userText), b = normalize(expected);
  if (!a) return false;
  if (a === b) return true;
  const threshold = Math.max(1, Math.floor(b.length * 0.25));
  return levenshtein(a, b) <= threshold;
}

function buildNav(){
  DOM.navBar.innerHTML = '';
  questions.forEach((q, idx) => {
    const b = document.createElement('div');
    b.className = 'nav-bubble';
    b.innerText = idx + 1;
    b.addEventListener('click', () => { activeIdx = idx; render(); });
    DOM.navBar.appendChild(b);
  });
}

function updateNav(){
  const bubbles = DOM.navBar.querySelectorAll('.nav-bubble');
  bubbles.forEach((b, idx) => {
    b.classList.remove('active','answered');
    if (idx === activeIdx) b.classList.add('active');
    if (state[idx].checked) b.classList.add('answered');
  });
}

function updateTotals(){
  const scored = state.reduce((sum, s) => sum + s.score, 0);
  const max = questions.reduce((sum, q) => sum + q.maxMarks, 0);
  DOM.totalScore.innerText = scored;
  DOM.totalMax.innerText = max;
}

function renderMCQOptions(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  const letters = ['A','B','C','D','E','F'];

  DOM.mcqOptions.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const row = document.createElement('div');
    row.className = 'mcq-option';
    if (s.selected === idx) row.classList.add('selected');
    if (s.checked){
      row.classList.add('disabled');
      if (idx === q.correct) row.classList.add('correct');
      else if (idx === s.selected) row.classList.add('incorrect');
    } else {
      row.addEventListener('click', () => { s.selected = idx; renderMCQOptions(); });
    }
    row.innerHTML = '<span class="opt-letter">' + letters[idx] + '</span><span>' + opt + '</span>';
    DOM.mcqOptions.appendChild(row);
  });

  if (s.checked){
    const correct = s.selected === q.correct;
    DOM.mcqFeedback.style.display = 'block';
    DOM.mcqFeedback.className = 'mcq-feedback ' + (correct ? 'hit' : 'miss');
    DOM.mcqFeedback.innerText = (correct ? 'Correct! ' : 'Incorrect — correct answer: ' + q.options[q.correct] + '. ') + '(' + s.score + '/1)';
  } else {
    DOM.mcqFeedback.style.display = 'none';
  }
}

function render(){
  const q = questions[activeIdx];
  const s = state[activeIdx];

  DOM.qNum.innerText = 'Question ' + (activeIdx + 1) + ' of ' + questions.length;
  DOM.marksBadge.innerText = q.maxMarks + (q.maxMarks === 1 ? ' mark' : ' marks');
  DOM.qText.innerText = q.text;

  if (q.type === 'mcq'){
    DOM.frqInputArea.style.display = 'none';
    DOM.mcqOptions.style.display = 'flex';
    DOM.checkBtn.innerText = 'Check Answer';
    DOM.resultBox.style.display = 'none';
    renderMCQOptions();
  } else {
    DOM.frqInputArea.style.display = 'block';
    DOM.mcqOptions.style.display = 'none';
    DOM.mcqFeedback.style.display = 'none';
    DOM.checkBtn.innerText = 'Check Answer';
    DOM.answerBox.value = s.text;
    DOM.answerBox.placeholder = q.type === 'numeric' ? 'Type your numeric answer...' : 'Type each answer on its own line...';
    document.getElementById('qHint').innerText = q.type === 'numeric'
      ? 'Enter a single number as your answer.'
      : 'Type one answer per line, in any order. Then check your answers.';

    if (s.checked){
      showResults(false);
    } else {
      DOM.resultBox.style.display = 'none';
    }
  }

  DOM.prevBtn.disabled = (activeIdx === 0);
  DOM.nextBtn.disabled = (activeIdx === questions.length - 1);

  updateNav();
  updateTotals();
}

function checkMCQAnswer(){
  const q = questions[activeIdx];
  const s = state[activeIdx];
  if (s.selected === undefined || s.selected === null) return;
  s.checked = true;
  s.score = (s.selected === q.correct) ? 1 : 0;
  renderMCQOptions();
  updateNav();
  updateTotals();
}

function checkAnswer(){
  const q = questions[activeIdx];
  if (q.type === 'mcq'){ checkMCQAnswer(); return; }

  const s = state[activeIdx];
  s.text = DOM.answerBox.value;

  if (q.type === 'numeric'){
    const raw = s.text.trim();
    const userNum = parseInt(raw.replace(/[^\d-]/g, ''), 10);
    const expectedNum = parseInt(q.answers[0], 10);
    const correct = raw.length > 0 && !isNaN(userNum) && userNum === expectedNum;
    s.score = correct ? 1 : 0;
    s.checked = true;
    s.matches = [correct ? raw : null];
    showResults(true);
    updateNav();
    updateTotals();
    return;
  }

  const lines = s.text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const used = new Array(lines.length).fill(false);
  const matches = q.answers.map(() => null);

  q.answers.forEach((expected, qi) => {
    let bestIdx = -1, bestDist = Infinity;
    lines.forEach((line, li) => {
      if (used[li]) return;
      const a = normalize(line), b = normalize(expected);
      const dist = levenshtein(a, b);
      const threshold = Math.max(1, Math.floor(b.length * 0.25));
      if (dist <= threshold && dist < bestDist){
        bestDist = dist; bestIdx = li;
      }
    });
    if (bestIdx !== -1){
      used[bestIdx] = true;
      matches[qi] = lines[bestIdx];
    }
  });

  s.score = matches.filter(m => m !== null).length;
  s.checked = true;
  s.matches = matches;

  showResults(true);
  updateNav();
  updateTotals();
}

function showResults(){
  const q = questions[activeIdx];
  const s = state[activeIdx];

  DOM.resultBox.style.display = 'flex';
  DOM.scoreNum.innerText = s.score + ' / ' + q.answers.length;
  DOM.resultRows.innerHTML = '';

  q.answers.forEach((expected, i) => {
    const matched = s.matches ? s.matches[i] : null;
    const row = document.createElement('div');
    row.className = 'result-row';
    const icon = document.createElement('div');
    icon.className = 'result-icon ' + (matched ? 'hit' : 'miss');
    icon.innerText = matched ? '✓' : '✕';
    const text = document.createElement('div');
    text.className = 'result-text';
    text.innerHTML = '<div class="expected">' + expected + '</div>' +
      (matched ? '<div class="matched">You wrote: "' + matched + '"</div>' : '<div class="matched">Not found in your answers</div>');
    row.appendChild(icon);
    row.appendChild(text);
    DOM.resultRows.appendChild(row);
  });
}

DOM.checkBtn.addEventListener('click', checkAnswer);
DOM.clearBtn.addEventListener('click', () => {
  const s = state[activeIdx];
  s.text = ''; s.checked = false; s.score = 0; s.matches = null; s.selected = undefined;
  render();
});

DOM.prevBtn.addEventListener('click', () => { if (activeIdx > 0){ activeIdx--; render(); } });
DOM.nextBtn.addEventListener('click', () => { if (activeIdx < questions.length - 1){ activeIdx++; render(); } });

document.addEventListener('keydown', (e) => {
  if (document.activeElement === DOM.answerBox) return;
  if (e.key === 'ArrowLeft'){ e.preventDefault(); DOM.prevBtn.click(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); DOM.nextBtn.click(); }
});
</script>
</body>
</html>
