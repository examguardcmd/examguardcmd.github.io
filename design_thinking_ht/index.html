<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPTEL Examination – Practice</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#111;background:#fff;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#hd{background:#1c4587;color:#fff;text-align:center;font-weight:bold;font-size:20px;padding:15px 10px;border-bottom:3px solid #d0d0d0}
.wrap{display:flex;height:calc(100vh - 62px);min-height:460px}
.left{flex:1;display:flex;flex-direction:column;min-width:0;border-right:2px solid #c8c8c8}
.secbar{display:flex;gap:6px;padding:9px 8px;border-bottom:2px solid #d4d4d4;overflow-x:auto;white-space:nowrap}
.sb{background:#fff;border:1px solid #1c4587;color:#1c4587;border-radius:3px;padding:6px 14px;font-size:14px}
.sb.on{background:#1c4587;color:#fff}
.marks{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid #d4d4d4;color:#777;font-size:14px;flex-wrap:wrap}
.marks .ml{display:flex;align-items:center;gap:10px;color:#444}
.marks .cb{background:#fff;border:1px solid #888;border-radius:3px;padding:4px 10px;font-size:13px;color:#333}
.mt{display:none;font-weight:bold;color:#1c4587}
.qarea{flex:1;overflow:auto;padding:22px 24px}
.qn{font-weight:bold;margin-bottom:14px}
.qt{font-size:15px;line-height:1.5;margin-bottom:14px;white-space:pre-line}
.fig{margin:4px 0 16px;overflow-x:auto;max-width:100%}
.fig svg{display:block}
.opt svg{width:200px;max-width:100%;height:auto;display:block}
.fb svg{width:200px;max-width:100%;height:auto;vertical-align:middle}
.unvn{margin-top:10px;font-size:12px;color:#7a5b00;background:#fff6dd;border:1px solid #e0b43c;border-radius:3px;padding:6px 10px;max-width:900px}
.shn{font-size:12px;color:#1c4587;margin:-6px 0 10px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;margin:2px 0;cursor:pointer;font-size:15px;line-height:1.4;border:1px solid transparent;border-radius:3px;max-width:900px}
.rad{width:15px;height:15px;border:1px solid #777;border-radius:50%;margin-top:2px;flex-shrink:0;position:relative;background:#fff}
.opt.sel .rad::after{content:"";position:absolute;inset:2px;background:#1c4587;border-radius:50%}
.locked .opt{cursor:default}
.opt.right{background:#e3f6e6;border-color:#2e9e4a}
.opt.wrong{background:#fde6e4;border-color:#d0392b}
.opt.show{background:#fff6dd;border-color:#e0b43c}
.fb{margin-top:14px;padding:10px 12px;border-radius:3px;font-weight:bold;max-width:900px}
.fb.ok{background:#e3f6e6;color:#1d7a35;border:1px solid #2e9e4a}
.fb.no{background:#fde6e4;color:#a82a1e;border:1px solid #d0392b}
.fb.info{background:#fff6dd;color:#7a5b00;border:1px solid #e0b43c}
.fb span{display:block;font-weight:normal;margin-top:4px;color:#222}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:3px solid #ececec;padding:14px 16px}
.nb{background:#1c4587;border:1px solid #1c4587;border-radius:4px;font-size:16px;color:#fff;padding:10px 18px}
.nb:disabled{background:#c9c9c9;border-color:#c9c9c9;color:#fff;cursor:not-allowed}
.nb .sm{display:none}
.mid{display:flex;gap:8px}
.pbtn{background:#fff;border:1px solid #1c4587;color:#1c4587;border-radius:3px;padding:7px 12px;font-size:14px}
.pbtn.y{background:#f6c343;border-color:#d9a900;color:#222}
.pbtn:disabled{opacity:.4;cursor:not-allowed}
.right{width:230px;flex-shrink:0;display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.course{font-size:13px;margin:6px 0 16px 8px}
.st{font-size:13px;margin:0 0 14px 6px}
.st b{font-weight:normal}
.rule{border-top:1px solid #222;margin:6px 0 14px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;align-content:start}
.pb{background:none;border:0;padding:0;display:flex;justify-content:center}
.sh{display:flex;align-items:center;justify-content:center;width:38px;height:34px;color:#fff;font-size:14px}
.sh.g{background:#3dc300;clip-path:polygon(20% 0,80% 0,100% 22%,100% 100%,0 100%,0 22%);padding-top:3px}
.sh.r{background:#ff0000;clip-path:polygon(0 0,100% 0,100% 78%,80% 100%,20% 100%,0 78%);padding-bottom:3px}
.sh.n{background:#d9d9d9;border-radius:5px}
.pb.cur{filter:drop-shadow(0 0 1px #000) drop-shadow(0 0 2px #1c4587)}
.sp{flex:1;min-height:14px}
.submit{background:#1c4587;color:#fff;border:0;border-radius:4px;font-size:18px;padding:9px;width:100%;margin-top:14px}
.ban{background:#444;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px}
.ban .code{color:#ff0;font-size:30px;font-weight:bold}
.ban .info{color:#ff0;font-weight:bold;font-size:18px;text-align:right;line-height:1.9}
.lbox{width:380px;max-width:92vw;margin:56px auto;border-radius:18px;overflow:hidden;background:#efefef;box-shadow:0 1px 4px #0002}
.lbox .lh{background:#b9b9b9;color:#000;font-weight:bold;font-size:16px;padding:14px 20px}
.lbox .lb{padding:42px 20px 44px}
.lrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lrow svg{width:26px;height:26px;flex-shrink:0;color:#222}
.lrow input{flex:1;min-width:0;border:2px solid #bdbdbd;background:#fff;padding:5px 7px;font-size:15px;border-radius:2px;outline:none}
.lrow input:focus{border-color:#1c4587}
.lerr{color:#c00;text-align:center;font-size:13px;min-height:18px;margin-top:10px}
.lgo{text-align:center;margin-top:14px}
.lgo button{background:#1c4587;color:#fff;border:0;border-radius:4px;padding:9px 26px;font-size:15px}
.lgo button:hover{background:#163a72}
.page{max-width:820px;margin:20px auto;padding:0 16px 40px}
.page h2{color:#1c4587}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.yr{margin:14px 0 6px}.yrh{font-size:16px;color:#1c4587}.yrh a{font-size:13px;color:#1c4587}
.mods label{border:1px solid #c8c8c8;padding:9px;border-radius:3px;cursor:pointer;display:flex;gap:6px;align-items:center}
.page label.l{display:block;margin:8px 0}
.btn{background:#1c4587;color:#fff;border:0;border-radius:3px;padding:9px 18px;font-size:15px}
.btn.o{background:#fff;color:#1c4587;border:1px solid #1c4587}
table.res{border-collapse:collapse;margin:10px 0}.res td,.res th{border:1px solid #c8c8c8;padding:6px 12px;text-align:left}
.rq{border:1px solid #c8c8c8;padding:8px;margin:6px 0;border-radius:3px;font-size:13px}
/* calculator */
#calc{position:fixed;top:120px;left:40px;width:330px;background:#e8e8e8;border:2px solid #4a5568;box-shadow:0 6px 24px #0006;z-index:50;display:none;user-select:none;touch-action:none}
#calc .ch{background:#4a5568;color:#fff;padding:6px 10px;display:flex;justify-content:space-between;cursor:move;font-weight:bold;font-size:13px}
#calc .ch span{cursor:pointer;padding:0 6px}
#cd{background:#dfe9d5;border:1px solid #888;margin:8px;padding:6px 8px;text-align:right;min-height:62px;font-family:"Courier New",monospace}
#ce{font-size:13px;color:#444;min-height:18px;word-break:break-all}
#cr{font-size:26px;font-weight:bold;overflow:hidden;white-space:nowrap}
.cm{display:flex;align-items:center;gap:10px;padding:0 8px 4px;font-size:12px}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 8px 10px}
.cg button,.cm button{padding:7px 0;font-size:13px;border:1px solid #888;border-radius:3px;background:linear-gradient(#fafafa,#d4d4d4);color:#222}
.cg button:active{background:#bbb}
.cg .op{background:linear-gradient(#e6eef7,#b9cde2)}.cg .eq{background:linear-gradient(#5aa8e6,#1b75bc);color:#fff}.cg .cl{background:linear-gradient(#f4a9a1,#d9534f);color:#fff}
.cm button{padding:3px 8px;font-size:12px}

#app:has(.disc){min-height:calc(100vh - 62px);display:flex;flex-direction:column}
.disc{margin:auto 0 0;padding:14px max(16px,calc((100% - 820px)/2));font-size:12px;line-height:1.55;color:#555;background:#f4f4f4;border-top:1px solid #d4d4d4}
.disc b{color:#333}
.ins{max-width:860px}
.ins h3{color:#1c4587;margin:22px 0 8px;border-bottom:1px solid #d4d4d4;padding-bottom:4px}
.ins p,.ins li{line-height:1.55}
.irow{display:flex;align-items:center;gap:14px;margin:8px 0}
.irow .pb{flex-shrink:0;width:44px;justify-content:center}
.ins table.res td:first-child{white-space:nowrap}
.ins kbd{background:#f1f1f1;border:1px solid #bbb;border-radius:3px;padding:0 5px;font-size:12px}
.ins .btnrow{margin:24px 0 10px}
@media(max-width:760px){
 .ban{flex-direction:column;align-items:flex-start;padding:12px 14px}.ban .info{text-align:left;font-size:15px;line-height:1.6}.ban .code{font-size:26px}
 .lbox{margin:30px auto}
 body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
 #hd{font-size:16px;padding:12px 8px}
 .wrap{flex-direction:column;height:auto;min-height:0}
 .left{border-right:0}
 .qarea{padding:14px 12px;overflow:visible}
 .opt{padding:12px 8px;font-size:16px}
 .rad{width:20px;height:20px}
 .qt{font-size:16px}
 .mt{display:inline}
 .right{width:100%;border-top:2px solid #c8c8c8;padding:12px}
 .pal{grid-template-columns:repeat(6,1fr)}
 .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;z-index:20;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 8px #0002}
 .nb{font-size:14px;padding:10px 12px}
 .nb .lg{display:none}.nb .sm{display:inline}
 .pbtn{padding:10px 8px;font-size:13px}
 .mods{grid-template-columns:1fr 1fr}
 #calc{left:2vw!important;width:96vw;max-width:380px;top:56px}
 .cg button{padding:11px 0;font-size:14px}
}
</style></head><body>
<div id="hd">NPTEL Examination - October 2026</div>
<div id="app"></div>
<div id="calc"></div>
<script>
const DATA=[{"name": "Week 1 (2025)", "qs": [{"q": "Evaluate whether the statement is true or false:\n“Robert Hooke is considered to be the father of Cytology.”", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 1}, {"q": "Complete the following sentence:\n“________is the time a drug can stay within the cell.”", "o": [["a", "Enflux"], ["b", "Ifflux"], ["c", "Efflux"], ["d", "Influx"]], "c": "d", "a": "Influx", "n": 2}, {"q": "Choose the correct option and complete the following sentence:\n“___________ is the study of cells.”", "o": [["a", "Histology"], ["b", "Cytology"], ["c", "Histopathology"], ["d", "None of the above"]], "c": "b", "a": "Cytology", "n": 3}, {"q": "A centrifuge uses _______ difference between the particles and the medium in which they are dispersed.", "o": [["a", "density"], ["b", "particle dimensions"], ["c", "surface roughness"], ["d", "solubility"]], "c": "a", "a": "density", "n": 4}, {"q": "Evaluate whether the statement is true or false:\n“DAPI is used for staining the cytoplasm of the cell.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 5}, {"q": "Which of these is not a characteristic of cancer cells?", "o": [["a", "Lack of cell signaling response"], ["b", "Loss of contact inhibition"], ["c", "Evade apoptosis"], ["d", "Normal nuclei"]], "c": "d", "a": "Normal nuclei", "n": 6}, {"q": "Which microscope is used inside a tissue culture room to look at the status of the cells that are being cultured?", "o": [["a", "Inverting microscope"], ["b", "Metallurgical microscope"], ["c", "Stereo microscope"], ["d", "None of the above"]], "c": "a", "a": "Inverting microscope", "n": 7}, {"q": "Choose the best option for the following statement:\n\"In the context of the microfluidic device used for drug screening, cell lysis will contribute to __________ in conductivity and hence, __________ in the impedance.\"", "o": [["a", "increase, increase"], ["b", "decrease, increase"], ["c", "decrease, decrease"], ["d", "increase, decrease"]], "c": "d", "a": "increase, decrease", "n": 8}, {"q": "Choose the best option for the following statement:\n“…………….. is used to concentrate the cell suspension and remove the supernatant.”", "o": [["a", "Microtome"], ["b", "Micromanipulator"], ["c", "Centrifuge"]], "c": "c", "a": "Centrifuge", "n": 9}, {"q": "The Cytospin technique uses a centrifuge to concentrate the cells on a slide such that immunocytochemistry is performed to evaluate the cells. Is the statement true or false?", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 10}]}, {"name": "Week 2 (2025)", "qs": [{"q": "Buffered oxide etch (BOE), a buffered HF solution, is used to remove SiO2. Which category of etching does this belong to?", "o": [["a", "Isotropic and Dry Etching"], ["b", "Isotropic and Wet Etching"], ["c", "Anisotropic and Dry Etching"], ["d", "Anisotropic and Wet Etching"]], "c": "b", "a": "Isotropic and Wet Etching", "n": 1}, {"q": "Soft bake and Hard bake are two essential steps for quality improvement of any photolithography patterning. In both processes, sample should be baked for 1 min time. What are the respective temperatures for soft bake and hard bake respectively?", "o": [["a", "90 degree Celsius and 120 degree Celsius"], ["b", "90 degree Celsius and 110 degree Celsius"], ["c", "70 degree Celsius and 100 degree Celsius"]], "c": "a", "a": "90 degree Celsius and 120 degree Celsius", "n": 2}, {"q": "What is the purpose of applying HMDS to a silicon wafer before spin coating photoresist?", "o": [["a", "It will remove native oxide impurities on Si wafer."], ["b", "It will control etch rate of Photoresist"], ["c", "It will improve adhesion of Photoresist on Si substrate"], ["d", "It is ISO standard to use HMDS before spin coating any Photoresist."]], "c": "c", "a": "It will improve adhesion of Photoresist on Si substrate", "n": 3}, {"q": "When etching an oxide contact hole with a given process, the etch selectivity compared to photoresist is found to be 2.5. If the oxide thickness to be etched is 140 nm and a 50% over etch is used, what is the minimum possible photoresist thickness (that is, how much resist will be etched away)?", "o": [["a", "56nm"], ["b", "84nm"], ["c", "28nm"]], "c": "b", "a": "84nm", "n": 4}, {"q": "Complete the below statement:\n“The mask having dark features and transparent background is known as _______ mask.”", "o": [["a", "Bright field"], ["b", "Dark field"]], "c": "a", "a": "Bright field", "n": 5}, {"q": "Seven photolithography steps are listed below. Put them in the correct sequence and select the matching option:\ni.   Soft bake\nii.  Photoresist coating\niii. Wafer Cleaning\niv. Primer coating\nv.  Exposure\nvi. Alignment\nvii. Development", "o": [["a", "iii – i – iv – ii – v – vi – vii"], ["b", "iii - iv – ii – i – vi – v – vii"], ["c", "iv – i – ii – vi – v – iii – vii"], ["d", "iii – iv – i – vi – v – vi – vii"]], "c": "b", "a": "iii - iv – ii – i – vi – v – vii", "n": 6}, {"q": "Choose the best option for the soft bake process used in photolithography.", "o": [["a", "Helps in partial evaporation of photoresist solvents"], ["b", "Improves adhesion"], ["c", "Improves uniformity"], ["d", "All the above"]], "c": "d", "a": "All the above", "n": 7}, {"q": "Evaluate whether the below statement is true or false:\n“Bulk micromachining is a process that creates a structure on the top of the substrate by film deposition and selective etching.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 8}, {"q": "Evaluate whether the statement is true or false:\n“Glass wafer to silicon wafer bonding can be done by plasma bonding”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 9}, {"q": "Micromachining is the technique to produce/fabricate MEMS device at micrometre scale. Below diagram show a cross sectional view of a fabricated VOC sensor. Which type of micromachining it is?", "o": [["a", "Bulk Micromachining"], ["b", "Surface Micromachining"], ["c", "Both Bulk and Surface Micromachining"]], "c": "c", "a": "Both Bulk and Surface Micromachining", "fig": "<svg viewBox=\"0 0 320 215\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" style=\"width:100%;max-width:320px;height:auto;background:#fff\" font-family=\"Arial,Helvetica,sans-serif\" font-size=\"14\"><defs><pattern id=\"h1\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"6\" stroke=\"#000\" stroke-width=\"2\"/></pattern><pattern id=\"d1\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\"><circle cx=\"2.5\" cy=\"2.5\" r=\"1.1\" fill=\"#000\"/></pattern></defs><rect x=\"20\" y=\"85\" width=\"280\" height=\"105\" fill=\"url(#h1)\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"20\" y=\"193\" width=\"280\" height=\"14\" fill=\"url(#d1)\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"20\" y=\"68\" width=\"83\" height=\"17\" fill=\"url(#d1)\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"213\" y=\"68\" width=\"87\" height=\"17\" fill=\"url(#d1)\" stroke=\"#000\" stroke-width=\"2\"/><path d=\"M103,68 L213,68 L198,135 L124,135 Z\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"103\" y=\"66\" width=\"110\" height=\"4\" fill=\"#fff\"/><rect x=\"20\" y=\"28\" width=\"280\" height=\"40\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><line x1=\"20\" y1=\"48\" x2=\"300\" y2=\"48\" stroke=\"#000\" stroke-width=\"1.5\"/><rect x=\"117\" y=\"33\" width=\"11\" height=\"11\" fill=\"#000\"/><rect x=\"134\" y=\"33\" width=\"11\" height=\"11\" fill=\"#000\"/><rect x=\"151\" y=\"33\" width=\"11\" height=\"11\" fill=\"#000\"/><rect x=\"168\" y=\"33\" width=\"11\" height=\"11\" fill=\"#000\"/><rect x=\"185\" y=\"33\" width=\"11\" height=\"11\" fill=\"#000\"/><rect x=\"111\" y=\"5\" width=\"90\" height=\"23\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2\"/><rect x=\"118\" y=\"10\" width=\"14\" height=\"13\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2.5\"/><rect x=\"139\" y=\"10\" width=\"14\" height=\"13\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2.5\"/><rect x=\"160\" y=\"10\" width=\"14\" height=\"13\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2.5\"/><rect x=\"181\" y=\"10\" width=\"14\" height=\"13\" fill=\"#fff\" stroke=\"#000\" stroke-width=\"2.5\"/></svg>", "n": 10}]}, {"name": "Week 3 (2025)", "qs": [{"q": "OCT is an imaging technique used for screening oral cancer. What does OCT stand for?", "o": [["a", "Optical Contrast Tomography"], ["b", "Oral Cancer Tomography"], ["c", "Optical Coherence Tomography"], ["d", "None of the above"]], "c": "c", "a": "Optical Coherence Tomography", "n": 1}, {"q": "Check whether the following statement is true or false:\n“Silicon dioxide was grown using the PECVD technique to fabricate piezo-resistive sensors, where PECVD stands for Plasma Efficient Chemical Vapor Deposition.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 2}, {"q": "What is the chemical used in surface conditioning?", "o": [["a", "HMDS (Hexamethyldixalazane)"], ["b", "KOH (potassium hydroxide)"], ["c", "Piranha (sulfuric acid and hydrogen peroxide)"], ["d", "PMMA (polymethylmethacrylate)"]], "c": "a", "a": "HMDS (Hexamethyldixalazane)", "n": 3}, {"q": "Complete the following sentence:\n“PEDOT: PSS is a ……………… polymer that can be spin coated over the interdigitated electrodes for the fabrication of piezoresistive sensors.”", "o": [["a", "non-conducting"], ["b", "conducting"], ["c", "semi-conducting"]], "c": "b", "a": "conducting", "n": 4}, {"q": "The amount of cell surface proteins for cancerous cells is relatively low compared to normal cells. Which of the following immune system cells can kill the cancer cells taking advantage of this?", "o": [["a", "T-lymphocytes"], ["b", "Helper T-Cells"], ["c", "Natural killer cells"]], "c": "c", "a": "Natural killer cells", "n": 5}, {"q": "Check whether the following statement is true or false:\n“ Stage I is considered as an early stage of invasive breast cancer.”", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 6}, {"q": "Complete the following statement:\n“During the fabrication of MEMS-based biochip shown in the lecture, the advantage of depositing silicon dioxide using PECVD is that deposition can be performed at a _________temperature.”", "o": [["a", "Higher"], ["b", "Lower"]], "c": "b", "a": "Lower", "n": 7}, {"q": "Which of the following is used for stripping the photoresist?", "o": [["a", "Ethanol"], ["b", "Buffered Hydrofluoric acid"], ["c", "Acetone"], ["d", "None of the above"]], "c": "c", "a": "Acetone", "n": 8}, {"q": "Choose whether the following statement is True or False:\n\"Soft bake for SU 8 is performed at 65 degrees Centigrade\"", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 9}, {"q": "During the fabrication of  piezo-resistive sensors, if conducting polymer such as PEDOT:PSS is used as the piezoresistive material, then which deposition technique will be used for this material?", "o": [["a", "PVD"], ["b", "PECVD"], ["c", "Spin coating"]], "c": "c", "a": "Spin coating", "n": 10}]}, {"name": "Week 4 (2025)", "qs": [{"q": "Check whether the following statement is true or false:\n“FNA is a type of biopsy that removes cells by making a slit using a syringe”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 1}, {"q": "Which of the following is not a procedure to detect breast lump in a patient?", "o": [["a", "Mammography"], ["b", "Chest x-ray"], ["c", "Core needle biopsy"]], "c": "b", "a": "Chest x-ray", "n": 2}, {"q": "What is the difference between a cancer cell and a normal cell?", "o": [["a", "Cancer cells divide irrepressibly whereas normal cells do not divide."], ["b", "Cancers cells do not exhibit as much variability in cell size compared to normal cells."], ["c", "Cancer cells do not differentiate after division whereas normal cells differentiate after division."], ["d", "Normal cells do not undergo angiogenesis like cancer cells."]], "c": "c", "a": "Cancer cell d resin, which gets converted to a solid 3D object.”", "o": [["a", "FDM (Fused Deposition Modelling)"], ["b", "SLA (Stereolithography)"], ["c", "SLS (Selective Laser Sintering)"]], "c": "b", "a": "SLA (Stereolithography)", "unv": true, "n": 4}, {"q": "Check whether the statement is true or false:\n“An active strain gauge generates its own voltage from mechanical displacement.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "unv": true, "n": 5}, {"q": "A PDMS microchannel layer (10:1 base to curing agent) is to be permanently bonded to a glass slide. Which method is used?", "o": [["a", "Anodic Bonding"], ["b", "Plasma Bonding"], ["c", "Using double-sided adhesive"], ["d", "Thermocompression"]], "c": "b", "a": "Plasma Bonding", "unv": true, "n": 6}, {"q": "A force sensor produces an output of a few millivolts that must be conditioned. Which of the following is not one of the stages explained in the lecture?", "o": [["a", "Wheatstone Bridge"], ["b", "Voltage Follower"], ["c", "Resistor Divider"], ["d", "Instrumentation Amplifier"]], "c": "c", "a": "Resistor Divider", "unv": true, "n": 7}, {"q": "Select the correct statements about 3D printing:\ni.   3D printing is a type of additive manufacturing.\nii.  3D printing enables to produce complex structures using less material, which is not possible to generate with traditional manufacturing methods.\niii. 3D printing is a type of subtractive manufacturing.\niv. A wide variety of plastics and metals can be used as 3D printing materials.", "o": [["a", "i and ii"], ["b", "iii and iv"], ["c", "i, ii, and iv"], ["d", "ii, iii, and iv"]], "c": "c", "a": "i, ii, and iv", "unv": true, "n": 8}, {"q": "Which 3D fabrication technique gives parts with the best dimensional accuracy and the smoothest surface finish?", "o": [["a", "Binder Jetting"], ["b", "Material Jetting"], ["c", "Direct Metal Laser Sintering"], ["d", "Fused Deposition Modelling"]], "c": "b", "a": "Material Jetting", "unv": true, "n": 9}, {"q": "In the  ["b", "Dark Field Microscopy"], ["c", "Phase Contrast Microscopy"]], "c": "c", "a": "Phase Contrast Microscopy", "unv": true, "n": 6}, {"q": "Which of the following statements about a vacuum desiccator is/are true?\nI. Desiccator is used to store devices and wafers for future use and protect them from contamination.\nII. Desiccators store the devices in an inert gas-filled environment protecting it from oxidation.\nWhich of the above statement(s) is/are true?", "o": [["a", "I only"], ["b", "II only"], ["c", "Both I and II"], ["d", "Neither I nor II"]], "c": "c", "a": "Both I and II", "unv": true, "n": 7}, {"q": "Which statement correctly describes how a PDMS microchannel is made?", "o": [["a", "An identical microchannel structure is patterned on silicon mold"], ["b", "A PDMS block is patterned using photolithography (UV region)."], ["c", "An inverted structure of the microchannel structure is patterned on a silicon mold"], ["d", "A PDMS block is patterned using e-beam lithography."]], "c": "c", "a": "An inverted structure of the microchannel structure is patterned on a silicon mold", "unv": true, "n": 8}, {"q": "Before using cleanroom facilities, gowning is a compulsory practice. Why it is important?\ni.   To keep samples safe from human body contamination.\nii.  To keep the user safe from harmful chemicals\niii. To increase the resolution of the fabricated devices.", "o": [["a", "i"], ["b", "ii"], ["c", "i, ii"], ["d", "i, ii, iii"]], "c": "c", "a": "i, ii", "unv": true, "n": 9}, {"q": "State whether the following statement is true or false:\n“In cleanroom, gloves are used to keep users safe during chemical handling”", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "unv": true, "n": 10}]}, {"name": "Week 11 (2025)", "qs": [{"q": "At about 37 °C, 95% humidity and 5% CO2, cells grow best under artificial conditions. Which equipment is based on providing this controlled set of growth parameters?", "o": [["a", "Incubator"], ["b", "Centrifuge"], ["c", "Bi ", "n": 4}, {"q": "A CO2 incubator for mammalian cells is typically set to 37 °C and 5% CO2. What is its primary purpose?", "o": [["a", "Cooling down culture flasks"], ["b", "Measuring cell viability"], ["c", "To maintain optimal temperature, humidity, and CO2 levels for cell growth"], ["d", "To preserve tissue samples at low temperature"]], "c": "c", "a": "To maintain optimal temperature, humidity, and CO2 levels for cell growth", "n": 5}, {"q": "What is the main function of an autoclave in a lab?", "o": [["a", "Cooling down culture flasks"], ["b", "Measuring cell viability"], ["c", "Sterilizing equipment and media using high-pressure steam"], ["d", "Maintaining constant CO2 levels for cell culture"]], "c": "c", "a": "Sterilizing equipment and media using high-pressure steam", "n": 6}, {"q": "Which of the following would be used to measure a 10 N force applied to a cantilever?", "o": [["a", "Strain gauges"], ["b", "Bellows"], ["c", "Bourdon gauges"], ["d", "All of these"]], "c": "a", "a": "Strain gauges", "n": 7}, {"q": "A strain gauge has a gauge factor of 2.1. What does the gauge factor represent?", "o": [["a", "Accuracy of sensor"], ["b", "Sensitivity of the sensor"], ["c", "Resolution of the system"], ["d", "none of the above"]], "c": "b", "a": "Sensitivity of the sensor", "n": 8}, {"q": "The role of a centrifuge in cell culture work is best described as", "o": [["a", "Measuring protein concentration"], ["b", "Separating components based on density using centrifugal force"], ["c", "Incubating cells under controlled conditions"], ["d", "Observing cells in real time"]], "c": "b", "a": "Separating components based on density using centrifugal force", "n": 9}, {"q": "Which equipment was used in the lectures to characterise the catheter force sensor?", "o": [["a", "Atomic Force Microscope"], ["b", "Micromanipulator"], ["c", "Hydraulic Actuators"], ["d", "None of the above"]], "c": "b", "a": "Micromanipulator", "n": 10}]}, {"name": "Week 2 (2024)", "qs": [{"q": "What is the ideal value of the anisotropy factor for a wet etch process?", "o": [["a", "1"], ["b", "0"], ["c", "0.5"], ["d", "Infinity"]], "c": "b", "a": "0", "n": 1}, {"q": "What are the reasons for using split-field microscopy in a mask aligner? Select the correct statements:\nI. As dimension of the alignment marks on wafer as well as masks are in micron range, microscopes are required to observe those while aligning\nII. Split-field microscopy enables the user to view the output from both the microscopes at time that helps to align faster\nIII. Split field microscopy gives better depth of focus\nIV. Split field microscopy system is easier to install and does not require any optimization", "o": [["a", "I, II, III, IV"], ["b", "I, II, III"], ["c", "I, II"], ["d", "I, II, IV"]], "c": "c", "a": "I, II", "n": 2}, {"q": "Which technique does bulk micromachining mainly use to remove unwanted material?", "o": [["a", "Plasma cleaning"], ["b", "Deep Reactive Ion Etching (DRIE)"], ["c", "Photolithography"], ["d", "Electroplating"]], "c": "b", "a": "Deep Reactive Ion Etching (DRIE)", "n": 3}, {"q": "Which of the following is not part of cleaning a Si (100) wafer before patterning?", "o": [["a", "Native oxide removal using HF"], ["b", "DI water rinse"], ["c", "Purging N2 gas"], ["d", "Dip wafer into TMAH (Tetramethylammonium hydroxide) at 80 C"]], "c": "d", "a": "Dip wafer into TMAH (Tetramethylammonium hydroxide) at 80 C", "n": 4}, {"q": "In conventional microfabrication, which unit process is the technology-limiting step?", "o": [["a", "Etching"], ["b", "Lift-off Technique"], ["c", "Masking"], ["d", "Lithography"]], "c": "d", "a": "Lithography", "n": 5}, {"q": "What is the reason for coating a Si substrate with HMDS?", "o": [["a", "It will remove native oxide impurities on Si wafer."], ["b", "It will control etch rate of Photoresist"], ["c", "It will improve adhesion of Photoresist on Si substrate"], ["d", "It is ISO standard to use HMDS before spin coating any Photoresist."]], "c": "c", "a": "It will improve adhesion of Photoresist on Si substrate", "n": 6}, {"q": "BOE (Buffered Oxide Etch) uses buffered HF to etch SiO2. What type of etching is this?", "o": [["a", "Isotropic and Dry Etching"], ["b", "Isotropic and Wet Etching"], ["c", "Anisotropic and Dry Etching"], ["d", "Anisotropic and Wet Etching"]], "c": "b", "a": "Isotropic and Wet Etching", "n": 7}, {"q": "Read the two statements below and choose the correct option:\nS1: Surface Micromachining is a process that produces structures inside the substrate by selective etching.\nS2: Bulk Micromachining is a process that creates structures on top of the substrate by film deposition and selective etching.", "o": [["a", "Both statements are correct."], ["b", "Only S1 is correct."], ["c", "Only S2 is correct."], ["d", "Both statements are incorrect."]], "c": "d", "a": "Both statements are incorrect.", "n": 8}, {"q": "Arrange the photolithography steps listed below in the correct order.\ni. Soft bake\nii. Photoresist coating\niii. Wafer Cleaning\niv. Primer coating\nv. Exposure\nvi. Alignment\nvii. Development", "o": [["a", "iii - i - iv - ii - v - vi - vii"], ["b", "iii - iv - ii - i - vi - v - vii"], ["c", "iv - i - ii - vi - v - iii - vii"], ["d", "iii - iv - i - vi - v - vi - vii"]], "c": "b", "a": "iii - iv - ii - i - vi - v - vii", "n": 9}, {"q": "Which of the following does not affect the thickness of spin-coated photoresist?", "o": [["a", "Spin coater rotation speed"], ["b", "Spin coating time"], ["c", "Viscosity of Photoresist"], ["d", "Coated Primer"]], "c": "d", "a": "Coated Primer", "n": 10}]}, {"name": "Week 3 (2024)", "qs": [{"q": "What is the purpose of using primers in lithography?", "o": [["a", "To enhance resolution."], ["b", "To improve the photoresist adhesion."], ["c", "To load the mask."], ["d", "To align the mask."]], "c": "b", "a": "To improve the photoresist adhesion.", "n": 1}, {"q": "An ideal tumor marker should", "o": [["a", "Be as inexpensive as possible."], ["b", "Change the way a physician treats a patient so as to affect outcome"], ["c", "Be 100% sensitive and 100% specific."], ["d", "Be used only to screen for the early detection of cancer."]], "c": "c", "a": "Be 100% sensitive and 100% specific.", "n": 2}, {"q": "Which biomarkers are used for metastatic breast cancer?", "o": [["a", "Epigenetic (methylation) and Estrogen receptor (ER)"], ["b", "Estrogen receptor (ER) and Epigenetic (methylation)"], ["c", "Progesterone receptor (PR) and Epigenetic (methylation)"], ["d", "Estrogen receptor (ER), Progesterone receptor (PR) and Human epidermal growth factor receptor 2 (HER2)"]], "c": "d", "a": "Estrogen receptor (ER), Progesterone receptor (PR) and Human epidermal growth factor receptor 2 (HER2)", "n": 3}, {"q": "Of the following, the most aggressive form of breast cancer is", "o": [["a", "Invasive ductal carcinoma"], ["b", "Invasive lobular carcinoma"], ["c", "Papillary carcinoma"], ["d", "All of these"]], "c": "a", "a": "Invasive ductal carcinoma", "n": 4}, {"q": "Why is silicon nitride deposited when fabricating a piezoresistive cantilever sensor for mechanical characterisation of cancer tissue?", "o": [["a", "For better insulation"], ["b", "For better adhesion of contact pads"], ["c", "For better conductivity"], ["d", "As stress releasing layer"]], "c": "d", "a": "As stress releasing layer", "n": 5}, {"q": "A piezoresistive pressure sensor works on the piezoresistive effect (change in resistivity due to mechanical stress). Where do the maximum stress and the maximum displacement occur in a square membrane?", "o": [["a", "Uniform throughout the membrane"], ["b", "At the edges and the centre respectively"], ["c", "At the center and at the edges respectively"], ["d", "Cannot be predicted"]], "c": "b", "a": "At the edges and the centre respectively", "n": 6}, {"q": "Evaluate the two statements below and pick the correct option:\nS1: Photoresist should have high etch resistance and good adhesion.\nS2: For PR coating, the final thickness is independent of the spin speed of the PR coater.", "o": [["a", "Both statements are correct."], ["b", "Only S1 is correct."], ["c", "Only S2 is correct."], ["d", "Both statements are incorrect."]], "c": "b", "a": "Only S1 is correct.", "n": 7}, {"q": "Which process yields silicon wafers of higher purity?", "o": [["a", "CZ technique"], ["b", "FZ technique"], ["c", "Boule generation"], ["d", "Epitaxial growth"]], "c": "b", "a": "FZ technique", "n": 8}, {"q": "Which PVD technique deposits films of better purity?", "o": [["a", "E-beam evaporation"], ["b", "Sputtering"], ["c", "Thermal evaporation"], ["d", "Thermal oxidation"]], "c": "a", "a": "E-beam evaporation", "n": 9}, {"q": "Which of the following statements about thermal oxidation are correct?\ni. Dry oxidation is about 10 times faster than wet oxidation\nii. Dry oxidation is mainly used for creating thin oxide layers and wet oxidation for thicker ones\niii. Dry oxidation is used for making field oxide layers and wet oxidation for gate oxides.\niv. Dry oxidation gives better quality oxide layers as compared to wet oxidation.", "o": [["a", "i, ii, iii, and iv"], ["b", "ii and iv"], ["c", "ii, iii and iv"], ["d", "i, ii, and iv"]], "c": "b", "a": "ii and iv", "n": 10}]}, {"name": "Week 4 (2024)", "qs": [{"q": "A Cr/Au interdigitated electrode (IDE) structure has finger spacings of 20 µm and 40 µm, with base resistances of x ohm and y ohm respectively. How are x and y related?", "o": [["a", "x>y"], ["b", "x=y"], ["c", "x<y"], ["d", "Cannot be predicted"]], "c": "b", "a": "x=y", "n": 1}, {"q": "Evaluate whether the following statement is True/False:\nPEDOT:PSS, a conductive polymer, can be used to realise a piezoresistive polymer sensor.", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 2}, {"q": "An SU-8 photoresist layer is made of", "o": [["a", "High sensitive polymer"], ["b", "Polysilicon"], ["c", "Light sensitive polymer"], ["d", "Silicon di oxide"]], "c": "c", "a": "Light sensitive polymer", "n": 3}, {"q": "Which of the following sensors can be used to measure the thermal conductivity of a tissue sample kept at 37 °C?", "o": [["a", "Piezoresistor"], ["b", "Strain Gauge"], ["c", "Thermistor"], ["d", "Potentiometer"]], "c": "c", "a": "Thermistor", "n": 4}, {"q": "Which properties does an ETM sensor measure for phenotyping breast cancer tissue?", "o": [["a", "Capacitance, elasticity, specific heat"], ["b", "Resistivity/resistance, elasticity, thermal conductivity"], ["c", "Resistivity/resistance, viscosity, specific heat"]], "c": "b", "a": "Resistivity/resistance, elasticity, thermal conductivity", "n": 5}, {"q": "What is the advantage of fabricating sensors such as microheaters on a diaphragm?", "o": [["a", "Reduces sensor footprint"], ["b", "Achieves desired working temperatures at lower voltage"], ["c", "Ease of fabrication"], ["d", "All the above"]], "c": "b", "a": "Achieves desired working temperatures at lower voltage", "n": 6}, {"q": "Which of the following is a favourable prognostic factor in breast cancer?", "o": [["a", "Tumour Grade III"], ["b", "Lymphatic and vascular invasion"], ["c", "Tumour size"], ["d", "ER positivity"]], "c": "d", "a": "ER positivity", "n": 7}, {"q": "What is the correct process sequence for fabricating SU-8 pillars on a Cr/Au layer?", "o": [["a", "spin coat, soft bake, UV exposure, PR development, hard bake"], ["b", "spin coat, soft bake, UV exposure, PR development, hard bake, annealing"], ["c", "spin coat, soft bake, UV exposure, hard bake, PR development, annealing"], ["d", "spin coat, soft bake, UV exposure, hard bake, PR development, acetone dip"]], "c": "c", "a": "spin coat, soft bake, UV exposure, hard bake, PR development, annealing", "n": 8}, {"q": "Which technology was used to make the housing of the electro-thermo-mechanical (ETM) phenotyping tool for breast cancer shown in the lectures?", "o": [["a", "Injection Moulding"], ["b", "3D Printing"], ["c", "Laser Cutting of Acrylic Sheets"], ["d", "Forming"]], "c": "b", "a": "3D Printing", "n": 9}, {"q": "“In the ETM phenotyping device, the indentor tip heats the tissue, and the microchip placed under the tissue, inside the 3D printed housing, measures its thermal properties.” The statement is –", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 10}]}, {"name": "Week 5 (2024)", "qs": [{"q": "Which of the following is not a morphological feature of a malignant cell?", "o": [["a", "regular size and shape"], ["b", "Prominent nucleoli"], ["c", "Infiltrating growth"], ["d", "scarce cytoplasm"]], "c": "a", "a": "regular size and shape", "n": 1}, {"q": "For which kind of specimen is phase contrast microscopy especially useful?", "o": [["a", "Fixed and stained tissue sections"], ["b", "Metal surfaces and crystal defects"], ["c", "Live, unstained biological cells"], ["d", "Fluorescent molecules in tissues"]], "c": "c", "a": "Live, unstained biological cells", "n": 2}, {"q": "Which cytology technique is designed specifically to yield a monolayer of cells for effective screening?", "o": [["a", "Spin coating"], ["b", "Fine needle aspiration"], ["c", "Brush cytology"], ["d", "Cytospin"]], "c": "d", "a": "Cytospin", "n": 3}, {"q": "Which part is found only in a phase contrast microscope and not in a bright field microscope?", "o": [["a", "Objective lens"], ["b", "Eyepiece"], ["c", "Phase plate"], ["d", "Condenser diaphragm"]], "c": "c", "a": "Phase plate", "n": 4}, {"q": "In immunohistochemistry, ____________ are used to detect antigens associated with cancer.", "o": [["a", "Antibiotics"], ["b", "Antibodies"], ["c", "T cells"], ["d", "None of the above"]], "c": "b", "a": "Antibodies", "n": 5}, {"q": "Which mechanism mainly provides contrast in bright field microscopy?", "o": [["a", "Variation in refractive index"], ["b", "Absorption of light by stained parts of the specimen"], ["c", "Interference between scattered and unscattered light"], ["d", "Fluorescence emission"]], "c": "b", "a": "Absorption of light by sity"], ["b", "surface roughness"], ["c", "solubility"], ["d", "colour"]], "c": "a", "a": "density", "n": 2}, {"q": "Which microscope is used inside a tissue culture room to check the status of cells growing in flasks?", "o": [["a", "Inverted microscope"], ["b", "Metallurgical microscope"], ["c", "Stereo microscope"], ["d", "Scanning electron microscope"]], "c": "a", "a": "Inverted microscope", "n": 3}, {"q": "Which of the following statements are correct?\n\nI. Cytology is the study of cells.\nII. Histology is the study of tissues.\nIII. DAPI is used to stain the cytoplasm of cells.", "o": [["a", "I only"], ["b", "I and II only"], ["c", "II and III only"], ["d", "I, II and III"]], "c": "b", "a": "I and II only", "n": 4}, {"q": "Mammalian cell cultures are typically incubated at ____ with 5% CO2.", "o": [["a", "4 °C"], ["b", "25 °C"], ["c", "37 °C"], ["d", "60 °C"]], "c": "c", "a": "37 °C", "n": 5}, {"q": "Which enzyme is commonly used to detach adherent cells from a culture flask?", "o": [["a", "Trypsin"], ["b", "Amylase"], ["c", "Lipase"], ["d", "Catalase"]], "c": "a", "a": "Trypsin", "n": 6}, {"q": "Which equipment provides a sterile working area while handling cell cultures?", "o": [["a", "Biosafety cabinet"], ["b", "Muffle furnace"], ["c", "Spin coater"], ["d", "Hot plate"]], "c": "a", "a": "Biosafety cabinet", "n": 7}, {"q": "A hemocytometer is used to", "o": [["a", "count cells"], ["b", "stain cells"], ["c", "sterilise media"], ["d", "fix tissues"]], "c": "a", "a": "count cells", "n": 8}]}, {"name": "Week 2 (Mixed)", "qs": [{"q": "HMDS (hexamethyldisilazane) is coated on a Si substrate before the photoresist mainly to", "o": [["a", "remove the native oxide"], ["b", "control the etch rate"], ["c", "improve resist adhesion"], ["d", "cool the wafer"]], "c": "c", "a": "improve resist adhesion", "n": 1}, {"q": "Etching SiO2 with buffered HF (BOE) is an example of", "o": [["a", "isotropic dry etching"], ["b", "isotropic wet etching"], ["c", "anisotropic dry etching  II, III"], ["c", "I, II"], ["d", "I, II, IV"]], "c": "c", "a": "I, II", "n": 2}, {"q": "Bulk micromachining primarily relies on which technique for removing unwanted material?", "o": [["a", "Plasma cleaning"], ["b", "Deep Reactive Ion Etching (DRIE)"], ["c", "Photolithography"], ["d", "Electroplating"]], "c": "b", "a": "Deep Reactive Ion Etching (DRIE)", "n": 3}, {"q": "Which is not a step of cleaning of Si wafer (100 orientation) before patterning?", "o": [["a", "Native oxide removal using HF"], ["b", "DI water rinse"], ["c", "Purging N2 gas"], ["d", "Dip wafer into TMAH (Tetramethylammonium hydroxide) at 80 C"]], "c": "d", "a": "Dip wafer into TMAH (Tetramethylammonium hydroxide) at 80 C", "n": 4}, {"q": "Traditionally, in the microfabrication process, which unit process is the technologically limiting process?", "o": [["a", "Etching"], ["b", "Lift-off Technique"], ["c", "Masking"], ["d", "Lithography"]], "c": "d", "a": "Lithography", "n": 5}, {"q": "Why HMDS (hexamethyldisilazane) is coated on Si substrate?", "o": [["a", "It will remove native oxide impurities on Si wafer."], ["b", "It will control etch rate of Photoresist"], ["c", "It will improve adhesion of Photoresist on Si substrate"], ["d", "It is ISO standard to use HMDS before spin coating any Photoresist."]], "c": "c", "a": "It will improve adhesion of Photoresist on Si substrate", "n": 6}, {"q": "Buffered HF is used as an etchant to etch out SiO2 layer, known as BOE (Buffered Oxide Etch). Which kind of etching is this?", "o": [["a", "Isotropic and Dry Etching"], ["b", "Isotropic and Wet Etching"], ["c", "Anisotropic and Dry Etching"], ["d", "Anisotropic and Wet Etching"]], "c": "b", "a": "Isotropic and Wet Etching", "n": 7}, {"q": "Consider the following two statements and select the correct answer:\nS1: Surface Micromachining is a process that produces structures inside the substrate by selective etching.\nS2: Bulk Micromachining is a process that creates structures on top of the substrate by film deposition and selective etching.", "o": [["a", "Both statements are correct."], ["b", "Only S1 is correct."], ["c", "Only S2 is correct."], ["d", "Both statements are incorrect."]], "c": "d", "a": "Both statements are incorrect.", "n": 8}, {"q": "Processes related to photolithography are mentioned here. Arrange the processes in proper order.\ni. Soft bake\nii. Photoresist coating\niii. Wafer Cleaning\niv. Primer coating\nv. Exposure\nvi. Alignment\nvii. Development", "o": [["a", "iii – i – iv – ii – v – vi – vii"], ["b", "iii - iv – ii – i – vi – v – vii"], ["c", "iv – i – ii – vi – v – iii – vii"], ["d", "iii – iv – i – vi – v – vi – vii"]], "c": "b", "a": "iii - iv – ii – i – vi – v – vii", "n": 9}, {"q": "Spin coated Photoresist thickness does not dependent on", "o": [["a", "Spin coater rotation speed"], ["b", "Spin coating time"], ["c", "Viscosity of Photoresist"], ["d", "Coated Primer"]], "c": "d", "a": "Coated Primer", "n": 10}, {"q": "Photoresists used in photolithography are broadly classified into which two types?", "o": [["a", "Positive and negative photoresists"], ["b", "Anodic and cathodic photoresists"], ["c", "Isotropic and anisotropic photoresists"], ["d", "Bright field and dark field photoresists"]], "c": "a", "a": "Positive and negative photoresists", "n": 11}]}, {"name": "Week 3 (2026)", "qs": [{"q": "Why are primers used in lithography?", "o": [["a", "To enhance resolution."], ["b", "To improve the photoresist adhesion."], ["c", "To load the mask."], ["d", "To align the mask."]], "c": "b", "a": "To improve the photoresist adhesion.", "n": 1}, {"q": "Tumor markers should", "o": [["a", "Be as inexpensive as possible."], ["b", "Change the way a physician treats a patient so as to affect outcome"], ["c", "Be 100% sensitive and 100% specific."], ["d", "Be used only to screen for the early detection of cancer."]], "c": "c", "a": "Be 100% sensitive and 100% specific.", "n": 2}, {"q": "Biomarkers for metastatic breast cancer are", "o": [["a", "Epigenetic (m e devices and wafers for future use and protect them from contamination\nII. Desiccators store the devices in an inert gas-filled environment protecting it from oxidation\nWhich of the above statement(s) is/are true?", "o": [["a", "I only"], ["b", "II only"], ["c", "I and II both"]], "c": "a", "a": "I only", "n": 3}, {"q": "Complete the following sentence:\n“Before microscopy, centrifuge is used to separate cells from the medium. A centrifuge uses _______ difference between the particles and the medium in which they are dispersed to separate.”", "o": [["a", "Surface roughness"], ["b", "Temperature"], ["c", "Density"], ["d", "Hydrophobicity"]], "c": "c", "a": "Density", "n": 4}, {"q": "What is the difference between an inverted microscope and a compound microscope?", "o": [["a", "The condenser lens and the light source remain above the specimen in inverted microscope whereas they remain below the specimen for the compound microscope"], ["b", "The condenser lens and the light source remain above the specimen in compound microscope whereas they remain below the specimen for the inverted microscope"], ["c", "The condenser lens remains above the specimen and the light source below in inverted microscope whereas they remain below the specimen for the compound microscope"], ["d", "The condenser lens remains above the specimen and the light source below in compound microscope whereas they remain below the specimen for the inverted microscope"]], "c": "a", "a": "The condenser lens and the light source remain above the specimen in inverted microscope whereas they remain below the specimen for the compound microscope", "n": 5}, {"q": "Sometimes, a microscope cannot accommodate a tissue section. So, it is sliced into pieces. Which of the following equipment can be used to do that?", "o": [["a", "Slicer"], ["b", "Microtome"], ["c", "Surgical blade"]], "c": "b", "a": "Microtome", "n": 6}, {"q": "Which of the following microscopy is suitable for viewing colourless and transparent specimens and live cells?", "o": [["a", "Bright Field Microscopy"], ["b", "Dark Field Microscopy"], ["c", "Phase Contrast Microscopy"]], "c": "c", "a": "Phase Contrast Microscopy", "n": 7}, {"q": "To fabricate a PDMS microchannel structure, which of the following statement is true?", "o": [["a", "An identical microchannel structure is patterned on silicon mold."], ["b", "A PDMS block is patterned using photolithography (UV region)."], ["c", "An inverted structure of the microchannel structure is patterned on a silicon mold."], ["d", "A PDMS block is patterned using e-beam lithography."]], "c": "c", "a": "An inverted structure of the microchannel structure is patterned on a silicon mold.", "n": 8}, {"q": "Why gowning is important prior to cleanroom entry?\nI. To keep samples safe from human body contamination.\nII. To keep the user safe from harmful chemicals\nIII. To increase the resolution of the fabricated devices.\nIV. To restrict the maximum number of users at a time in the lab.", "o": [["a", "i"], ["b", "i, ii"], ["c", "i, ii, iii"], ["d", "i, ii, iv"]], "c": "b", "a": "i, ii", "n": 9}]}, {"name": "Week 11 (2026)", "qs": [{"q": "Complete the following statement:\n“________ provides an environment to work safely with infectious biological materials (bacteria, virus or other infectious tissues) in the lab.”", "o": [["a", "Fume hood"], ["b", "Bio safety hood"], ["c", "Laboratory work bench"]], "c": "b", "a": "Bio safety hood", "n": 1}, {"q": "Evaluate whether the following statement is true or false regarding the use of incubators:\n\"Bacterial and Mammalian Cells can be cultured at the same time inside a common incubator.\"", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 2}, {"q": "Check whether the following statement is true or false:\n“In anisotropic etching, the etching rate is constant along with all directions; that is, the properties of a material are independent of the direction.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 3}, {"q": "Four probe method is the method used in impedance analyzer to calibrate impedance with function of frequency. Why four probe method is used to calibrate impedance in place of conventional voltmeter?", "o": [["a", "Four probe method is faster calibration method."], ["b", "Four probe method will give better accuracy due to exclusion of parasitic resistance of contact leads."], ["c", "Four probe method will give better accuracy due to inclusion of parasitic resistance of contact leads."]], "c": "b", "a": "Four probe method will give better accuracy due to exclusion of parasitic resistance of contact leads.", "n": 4}, {"q": "In the aspect of 3D printing techniques, what does SLS stands for?", "o": [["a", "Stereo lithography sintering"], ["b", "Selective laser sintering"], ["c", "Selective laminar sintering"]], "c": "b", "a": "Selective laser sintering", "n": 5}, {"q": "Complete the following sentence:\n“in vivo situation of body can be mimicked most faithfully by ---------”", "o": [["a", "IDE structure"], ["b", "Micro-tubules with peristaltic pump"], ["c", "Microfluidic chips"]], "c": "c", "a": "Microfluidic chips", "n": 6}, {"q": "Ultrasonic bath is used to:\nI. Dissolve solute particles in solvent\nII. Substrate cleaning\nIII. Substrate coating\nIV. Decrease particle count in room by ultrasonic radiation.", "o": [["a", "I"], ["b", "I, II"], ["c", "I, II, III"], ["d", "I, II, III, IV"]], "c": "b", "a": "I, II", "n": 7}, {"q": "Which of the following statement(s) is/ are correct:\nI. UV light is used to sterilize the biosafety hood after use.\nII. UV light should be switched on while the biosafety hood is being used.", "o": [["a", "I only"], ["b", "II only"], ["c", "Both I and II"], ["d", "Neither I nor II"]], "c": "a", "a": "I only", "n": 8}, {"q": "Complete the following sentence:\n“___________ is based on the principle that organisms require a particular set of parameters for their growth and development with the optimal condition (under artificial conditions) of temperature, humidity, oxygen, and CO2 levels.”", "o": [["a", "Autoclave"], ["b", "Incubator"], ["c", "Centrifuge"], ["d", "Biosafety hood"]], "c": "b", "a": "Incubator", "n": 9}, {"q": "Which 3D-printing method uses liquid resin to convert to solid 3D objects?", "o": [["a", "FDM"], ["b", "SLS"], ["c", "SLA"]], "c": "c", "a": "SLA", "n": 10}]}, {"name": "Week 12 (2026)", "qs": [{"q": "Complete the following sentence:\n“Working principle of metal-oxide based gas sensors is _____________”", "o": [["a", "Electron diffusion through sensing layer"], ["b", "Absorption of the volatile organic compounds on the sensing layer"], ["c", "Adsorption of the volatile organic compounds on the sensing layer"], ["d", "Tunnelling of gas through the sensing layer"]], "c": "c", "a": "Adsorption of the volatile organic compounds on the sensing layer", "n": 1}, {"q": "Consider the following statements and select the correct option:\nS1: Sputtering is a chemical way of thin film deposition.\nS2: Thermal Evaporation is a thin film deposition technique.", "o": [["a", "Both Statements are correct."], ["b", "Both Statements are incorrect."], ["c", "Only S1 is correct."], ["d", "Only S2 is correct."]], "c": "d", "a": "Only S2 is correct.", "n": 2}, {"q": "Evaluate whether the following statement is true or false:\n“Biological simulations such as bio-heating cannot be performed using COMSOL Multiphysics.”", "o": [["a", "True"], ["b", "False"]], "c": "b", "a": "False", "n": 3}, {"q": "To model a micro-resistor beam in COMSOL, which physics will you solve for in a scenario of multi-physics simulation?", "o": [["a", "Only Electrical and structural physics"], ["b", "Only Structural and thermal physics"], ["c", "Only Thermal and Electrical physics"], ["d", "Electrical, thermal and structural physics"]], "c": "d", "a": "Electrical, thermal and structural physics", "n": 4}, {"q": "Consider the following two statements about DAQ and select the correct option:\nS1: It can be used as a function generator.\nS2: It can be used as a logic analyzer.", "o": [["a", "Both Statements are correct."], ["b", "Both Statements are incorrect."], ["c", "Only S1 is correct."], ["d", "Only S2 is correct."]], "c": "b", "a": "Both Statements are incorrect.", "n": 5}, {"q": "Which among the following techniques is used for NiCr (Nichrome) deposition during the fabrication of gas sensors?", "o": [["a", "Sputtering"], ["b", "Thermal oxidation"], ["c", "Spin coating"]], "c": "a", "a": "Sputtering", "n": 6}, {"q": "Considering the COMSOL Multiphysics simulation, what should be the flow of the modeling?\nA. Make geometry.\nB. Post-process results\nC. Add materials.\nD. Choose the type of study.\nE. Apply physics conditions.", "o": [["a", "A, C, E, B, E"], ["b", "A, C, D, E, B"], ["c", "A, C, E, D, B"], ["d", "A, C, E, B, D"]], "c": "c", "a": "A, C, E, D, B", "n": 7}, {"q": "Which is the most critical subprocess in microfabrication?", "o": [["a", "Thin Film Deposition"], ["b", "Lithography"], ["c", "Etching"], ["d", "Characterization"]], "c": "b", "a": "Lithography", "n": 8}, {"q": "Evaluate if the statement is true or false:\n“Streamline plot is used to visualize the direction and amplitude of vector variables in COMSOL.”", "o": [["a", "True"], ["b", "False"]], "c": "a", "a": "True", "n": 9}, {"q": "What are the applications for Gas Sensors?", "o": [["a", "VOC sensing"], ["b", "Detect Flammable gases"], ["c", "Food Safety and Security"], ["d", "All of the above"]], "c": "d", "a": "All of the above", "n": 10}]}, {"name": "Week 7 (2026)", "qs": [{"q": "Complete the following sentence:\n“The noise generated by the power supply in the ECG circuit can be reduced by…………..”", "o": [["a", "Implementing band pass filters"], ["b", "Implementing high pass filters"], ["c", "Implementing notch filters"]], "c": "c", "a": "Implementing notch filters", "n": 1}, {"q": "What is the effect of motion artifacts in ECG recordings?", "o": [["a", "Changes the rate of acquisition"], ["b", "Ch const UNSAFE=/\babove\b|\bbelow\b|\b[a-d]\)|(all|none|both|neither) of (these|the (above|options|following))|\boptions? [a-d]\b|\b(a|b|c|d) (and|&) (a|b|c|d)\b/i;
function prepare(q,mi,modName){
  const base={...q,mod:modName,id:mi+'-'+q.n,mi,shuffled:false};
  if(!optShuf||q.o.length<2||q.o.some(o=>UNSAFE.test(o[1]))||(q.o.length===2&&q.o.every(o=>/^(true|false)$/i.test(o[1]))))return base;
  const L=q.o.map(o=>o[0]),texts=q.o.map(o=>o[1]),ct=q.o.find(o=>o[0]===q.c)[1];
  let idx=texts.map((_,i)=>i),tries=0;
  do{shuffle(idx);tries++}while(idx.every((v,i)=>v===i)&&tries<20);
  base.o=idx.map((oi,pos)=>[L[pos],texts[oi]]);
  base.c=L[idx.indexOf(texts.indexOf(ct))];
  base.shuffled=true;return base;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const C={ex:'',res:'0',done:false,deg:true,mem:0,ans:0};
function calcEval(src,deg){
  const s=src.replace(/\s+/g,'');let p=0;
  const fail=()=>{throw new Error('x')};
  const toR=x=>deg?x*Math.PI/180:x,fromR=x=>deg?x*180/Math.PI:x;

  const fre=/^(asin|acos|atan|sinh|cosh|tanh|sin|cos|tan|log|ln)\(/;
  function expr(){let v=term();while(s[p]==='+'||s[p]==='−'||s[p]==='-'){const o=s[p++];const r=term();v=o==='+'?v+r:v-r}return v}
  function startsPrimary(){const c=s[p];return c==='('||c==='π'||c==='√'||(c==='e')||fre.test(s.slice(p))}
  function term(){let v=unary();for(;;){
    if(s[p]==='×'||s[p]==='*'){p++;v*=unary()}
    else if(s[p]==='÷'||s[p]==='/'){p++;v/=unary()}
    else if(s.startsWith('mod',p)){p+=3;const r=unary();v=((v%r)+r)%r}
    else if(p<s.length&&startsPrimary()){v*=unary()}
    else return v}}
  function unary(){if(s[p]==='-'||s[p]==='−'){p++;return -unary()}if(s[p]==='+'){p++;return unary()}return pw()}
  function pw(){const b=post();if(s[p]==='^'){p++;return Math.pow(b,unary())}return b}
  function post(){let v=prim();for(;;){if(s[p]==='!'){p++;v=fact(v)}else if(s[p]==='%'){p++;v/=100}else return v}}
  function prim(){
    if(s[p]==='('){p++;const v=expr();if(s[p]===')')p++;return v}
    if(s[p]==='π'){p++;return Math.PI}
    if(s[p]==='e'){p++;return Math.E}
    if(s[p]==='√'){p++;if(s[p]==='('){p++;const v=expr();if(s[p]===')')p++;return Math.sqrt(v)}return Math.sqrt(prim())}
    const m=fre.exec(s.slice(p));

    if(n){p+=n[0].length;return parseFloat(n[0].replace('E','e'))}
    fail()}
  const v=expr();if(p<s.length)fail();return v;
}

  <h3>1. Marking</h3>
  <ul><li>Every question carries <b>1 mark</b>; a correct answer scores 1 and a wrong answer scores 0 (no negative marking).</li>
  <li>Each question has a single correct option. Click an option to answer. You get instant right/wrong feedback, or press <b>Show Answer</b> to peek, then <b>Try Again</b> to re-attempt it.</li>
  <li>Use <b>Previous / Next</b> or click any number in the question palette to move around. Press <b>Submit</b> (bottom of the palette) when you are done.</li></ul>

  <h3>2. Question palette symbols</h3>
  <p>The palette on the right shows one icon per question:</p>
  <div class="irow"><span class="pb">${sh('g',1)}</span><div><b>Green (pointed top)</b> – <i>Complete</i>. You have answered this question.</div></div>
  <div class="irow"><span class="pb">${sh('r',2)}</span><div><b>Red (pointed bottom)</b> – <i>Incomplete</i>. You have opened this question but not answered it.</div></div>
  <div class="irow"><span class="pb">${sh('n',3)}</span><div><b>Grey rounded rectangle</b> – <i>Not viewed</i>. You have not opened this question yet.</div></div>
  <div class="irow"><span class="pb cur">${sh('n',4)}</span><div><b>Dark outline</b> around an icon – the question you are on right now.</div></div>
  <p>The counters above the palette (Complete / Incomplete / Not Viewed) update automatically. If you pick more than 50 questions they are split into <b>Sections</b> of up to 50, with a button for each section at the top.</p>

  <h3>3. Timer</h3>
  <p>The timer <b>counts down</b> from the time allotted to you and is shown at the top of the question panel (and in the side panel). It turns <b style="color:#c00">red</b> in the last 5 minutes. When it reaches <b>00:00:00</b> the test is <b>submitted automatically</b>.</p>
  <p>The full exam gives <b>180 minutes for 100 questions</b>. For any other number of questions the time follows the same linear rule:</p>
  <p style="background:#eef3fb;border:1px solid #b9cde9;border-radius:3px;padding:8px 12px"><b>Time (minutes) = 1.8 × number of questions</b>, then rounded <b>up</b> to the next multiple of 5 minutes.</p>
  <table class="res"><tr><th>Questions</th><th>Exact (1.8 × N)</th><th>Time allotted</th></tr>${ex.map(n=>`<tr><td>${n}</td><td>${+(1.8*n).toFixed(1)} min</td><td><b>${timeFor(n)} min</b></td></tr>`).join('')}</table>
  <p>You will see the exact time for your selection on the setup screen before you begin.</p>

  <h3>4. Calculator</h3>
  <p>Click the <b>🖩 Calculator</b> button above the question to open a scientific calculator. Drag it by its title bar to move it; click ✕ to close it (your memory and last answer are kept).</p>
  <ul>
   <li><b>Display:</b> the small line shows the expression you are typing; the large line shows the result.</li>
   <li><b>=</b> evaluates the expression. After a result, typing an operator (+ − × ÷ …) continues from that result; typing a number starts a fresh calculation.</li>
   <li><b>⌫</b> deletes the last entry, <b>C</b> clears everything, <b>±</b> flips the sign of the whole expression, <b>Ans</b> inserts the previous result.</li>
   <li><b>Deg / Rad</b> selects the angle unit for sin, cos and tan (and their inverses). Default is Deg.</li>
   <li><b>Functions:</b> sin cos tan, sin⁻¹ cos⁻¹ tan⁻¹, sinh cosh tanh, log (base 10), ln, √, x², x³, xʸ, 1/x, n!, 10ˣ, eˣ, π, e, % and mod. Brackets are supported and <i>2π</i> or <i>3(4+1)</i> work as multiplication.</li>
   <li><b>Exp</b> enters a power of ten: <i>3 Exp 2</i> means 3×10², i.e. 300.</li>
   <li><b>Memory:</b> MS stores the displayed result, MR recalls it, M+ / M− add or subtract the displayed result, MC clears the memory.</li>
  </ul>

  <h3>5. Keyboard shortcuts</h3>
  <p><kbd>a</kbd> <kbd>b</kbd> <kbd>c</kbd> <kbd>d</kbd> pick an option &nbsp;·&nbsp; <kbd>S</kbd> show/hide answer &nbsp;·&nbsp; <kbd>Enter</kbd> or <kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> previous.</p>

  <div class="btnrow"><button class="btn" onclick="showStart()">I have read the instructions – Continue</button></div></div>`;
  window.scrollTo(0,0);
}
