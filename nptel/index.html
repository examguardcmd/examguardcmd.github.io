<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPTEL Practice – Genome Editing MCQs</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222;background:#fff}
header{background:#2b3a67;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:12px;flex-wrap:wrap}
header .t{font-size:18px;font-weight:bold}
header .t small{display:block;font-size:11px;font-weight:normal;opacity:.8}
.cand{display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:4px;background:#cfd6e8;color:#2b3a67;display:flex;align-items:center;justify-content:center;font-weight:bold}
.timer{background:#fff;color:#c0392b;font-weight:bold;padding:4px 10px;border-radius:3px;font-size:15px}
.sub{background:#eef1f7;border-bottom:1px solid #cfd6e8;padding:6px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px}
.layout{display:flex;min-height:calc(100vh - 130px)}
.main{flex:1;padding:16px 20px;min-width:0}
.side{width:290px;border-left:1px solid #cfd6e8;background:#f7f8fb;padding:12px;flex-shrink:0}
.qhead{background:#2b3a67;color:#fff;padding:6px 12px;font-weight:bold;display:flex;justify-content:space-between}
.qbox{border:1px solid #cfd6e8;border-top:0;padding:18px}
.qtext{font-size:16px;line-height:1.5;margin-bottom:16px;font-weight:bold}
.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid #cfd6e8;border-radius:4px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:#fff;font-size:15px;line-height:1.4}
.opt:hover{background:#f0f4ff}
.opt .r{width:16px;height:16px;border:2px solid #666;border-radius:50%;margin-top:2px;flex-shrink:0;position:relative}
.opt.sel .r::after{content:"";position:absolute;inset:2px;background:#2b3a67;border-radius:50%}
.opt .k{font-weight:bold;color:#555;min-width:16px}
.locked .opt{cursor:default}
.locked .opt:hover{background:#fff}
.opt.right{background:#e3f6e6;border-color:#2e9e4a}
.opt.wrong{background:#fde6e4;border-color:#d0392b}
.fb{margin-top:12px;padding:12px;border-radius:4px;font-weight:bold;font-size:15px}
.fb.ok{background:#e3f6e6;color:#1d7a35;border:1px solid #2e9e4a}
.fb.no{background:#fde6e4;color:#a82a1e;border:1px solid #d0392b}
.fb.info{background:#fff6dd;color:#7a5b00;border:1px solid #e0b43c}
.fb span{display:block;font-weight:normal;margin-top:4px;color:#222}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:3px;padding:8px 16px;border:1px solid #2b3a67;background:#fff;color:#2b3a67}
button.p{background:#2b3a67;color:#fff}
button.g{background:#2e9e4a;border-color:#2e9e4a;color:#fff}
button.pu{background:#7b3fa0;border-color:#7b3fa0;color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0;max-height:46vh;overflow:auto}
.pal button{padding:6px 0;background:#bbb;border-color:#999;color:#222;font-weight:bold;border-radius:4px}
.pal button.cur{outline:3px solid #2b3a67}
.pal button.c{background:#2e9e4a;color:#fff;border-color:#2e9e4a}
.pal button.w{background:#d0392b;color:#fff;border-color:#d0392b}
.pal button.v{background:#e0b43c;border-color:#e0b43c;color:#222}
.pal button.m{background:#7b3fa0;color:#fff;border-color:#7b3fa0}
.legend div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.opt.show{background:#fff6dd;border-color:#e0b43c}
.legend i{width:18px;height:18px;border-radius:3px;display:inline-block}
.score{background:#fff;border:1px solid #cfd6e8;padding:8px;border-radius:4px;margin-bottom:8px;font-size:13px}
.start{max-width:760px;margin:30px auto;padding:0 16px}
.start h2{color:#2b3a67}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.mods label{border:1px solid #cfd6e8;padding:8px;border-radius:4px;cursor:pointer;display:flex;gap:6px;align-items:center;background:#fff}
.opts label{display:block;margin:6px 0}
.res td,.res th{border:1px solid #cfd6e8;padding:6px 10px;text-align:left}
.res{border-collapse:collapse;margin:10px 0}
.hide{display:none}
/* calculator */
#calc{position:fixed;top:120px;left:40px;width:330px;background:#e8e8e8;border:2px solid #4a5568;box-shadow:0 6px 24px #0006;z-index:50;display:none;user-select:none;touch-action:none}
#calc .ch{background:#4a5568;color:#fff;padding:6px 10px;display:flex;justify-content:space-between;cursor:move;font-weight:bold;font-size:13px}
#calc .ch span{cursor:pointer;padding:0 6px}
#cd{background:#dfe9d5;border:1px solid #888;margin:8px;padding:6px 8px;text-align:right;min-height:62px;font-family:"Courier New",monospace}
#ce{font-size:13px;color:#444;min-height:18px;word-break:break-all}
#cr{font-size:26px;font-weight:bold;overflow:hidden;white-space:nowrap}
.cm{display:flex;align-items:center;gap:10px;padding:0 8px 4px;font-size:12px}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 8px 10px}
.cg button,.cm button{padding:7px 0;font-size:13px;border:1px solid #888;border-radius:3px;background:linear-gradient(#fafafa,#d4d4d4);color:#222}
.cg button:active{background:#bbb}
.cg .op{background:linear-gradient(#e6eef7,#b9cde2)}.cg .eq{background:linear-gradient(#5aa8e6,#1b75bc);color:#fff}.cg .cl{background:linear-gradient(#f4a9a1,#d9534f);color:#fff}
.cm button{padding:3px 8px;font-size:12px}

.mst{font-size:11px;color:#1d7a35;font-weight:bold}
.shnote{background:#eef1f7;border:1px solid #cfd6e8;font-size:12px;padding:4px 8px;margin-bottom:10px;border-radius:3px;color:#2b3a67}
button,.opt,.pal button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;-webkit-text-size-adjust:100%}
@media(max-width:760px){
 body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
 header{padding:6px 10px}
 header .t{font-size:16px}
 .cand>div:nth-child(2){display:none}
 .avatar{width:30px;height:30px}
 .timer{font-size:14px;padding:3px 8px}
 .sub{padding:6px 10px;font-size:12px}
 .layout{flex-direction:column;min-height:0}
 .main{padding:10px}
 .qbox{padding:12px}
 .qtext{font-size:16px}
 .opt{padding:13px 12px;font-size:16px}
 .rad{width:20px;height:20px}
 .side{width:100%;border-left:0;border-top:1px solid #cfd6e8;padding:10px}
 .pal{grid-template-columns:repeat(6,1fr);max-height:none}
 .pal button{padding:10px 0}
 .qbtns{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid #2b3a67;margin:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 -2px 8px #0002}
 .qbtns button{padding:11px 4px;font-size:13px}
 .start{margin:12px auto}
 .mods{grid-template-columns:1fr 1fr}
 .mods label{padding:12px 8px}
 .opts label{padding:6px 0}
 #calc{left:2vw!important;width:96vw;max-width:380px;top:56px}
 .cg button{padding:11px 0;font-size:14px}
}
</style></head><body>

 "o": [["a", "CRISPR-Cas9"], ["b", "TALENs"], ["c", "PCR"], ["d", "Zinc finger nucleases"]], "c": "c", "a": "c) PCR"}, {"n": 9, "q": "The 2020 Nobel Prize for Chemistry was awarded to Charpentier and Doudna for development of which editing technology?", "o": [["a", "CRISPR/Cas9"], ["b", "TALEN"], ["c", "ZFN"], ["d", "Meganucleases"]], "c": "a", "a": "a) CRISPR/Cas9"}, {"n": 10, "q": "Which of the following diseases has been targeted for potential treatment using genome editing techniques?", "o": [["a", "Common cold"], ["b", "Parkinson's disease"], ["c", "Seasonal allergies"], ["d", "Migraine headaches"]], "c": "b", "a": "b) Parkinson's disease"}]}, {"name": "Module 2", "qs": [{"n": 1, "q": "A DNA molecule contains 14% thymine (T). What percentage of cytosine (C) is present?", "o": [["a", "14%"], ["b", "28%"], ["c", "36%"], ["d", "72%"]], "c": "c", "a": "c) 36%"}, {"n": 2, "q": "Which scientist produced the famous X-ray diffraction images that were crucial in determining the double-helical structure of DNA?", "o": [["a", "Linus Pauling"], ["b", "James Watson"], ["c", "Francis Crick"], ["d", "Rosalind Franklin"]], "c": "d", "a": "d) Rosalind Franklin"}, {"n": 3, "q": "Which of the following codons was the first to be deciphered during the cracking of the genetic code?", "o": [["a", "AAA – Lysine"], ["b", "UUU – Phenylalanine"], ["c", "GGG – Glycine"], ["d", "CCC – Proline"]], "c": "b", "a": "b) UUU – Phenylalanine"}, {"n": 4, "q": "Which of the following statements is/are true with respect to the chromosome of Escherichia coli? (I) The chromosome of E. coli is circular, approximately 4.6 Mb long. (II) DNA replication in E. coli proceeds bidirectionally from the origin of replication. (III) Six spatial domains have been identified in the E. coli chromosome, four structured (Ori, Ter, Left, and Right) and two non-structured (NS Left and NS Right). (IV) The E. coli chromosome contains multiple origins of replication distributed throughout the genome.", "o": [["a", "Only  "Which molecule acts as the methyl group donor in DNMT-catalyzed DNA methylation?", "o": [["a", "S-adenosylmethionine (SAM)"], ["b", "5-Methyltetrahydrofolate (5-methyl-THF)"], ["c", "Betaine (Trimethylglycine)"], ["d", "Methylcobalamin (Vitamin B₁₂)"]], "c": "a", "a": "S-adenosylmethionine (SAM)"}, {"n": 2, "q": "Which of the following is NOT classified as an ionizing radiation?", "o": [["a", "X rays"], ["b", "Gamma rays"], ["c", "Ultraviolet rays"], ["d", "Alpha particles"]], "c": "c", "a": "Ultraviolet rays"}, {"n": 3, "q": "Which enzyme is responsible for photoreactivation of UV-induced DNA damage?", "o": [["a", "DNA photolyase"], ["b", "DNA ligase"], ["c", "DNA polymerase I"], ["d", "DNA glycosylase"]], "c": "a", "a": "DNA photolyase"}, {"n": 4, "q": "Mutations in the ERCC8 (CSA) gene are associated with which of the following genetic disorders?", "o": [["a", "Xeroderma pigmentosum"], ["b", "Cockayne syndrome"], ["c", "Fanconi anemia"], ["d", "Lynch syndrome"]], "c": "b", "a": "Cockayne syndrome"}, {"n": 5, "q": "Which of the following is a high-fidelity DNA polymerase?", "o": [["a", "DNA Polymerase λ"], ["b", "DNA Polymerase δ"], ["c", "DNA Polymerase ζ"], ["d", "DNA Polymerase θ"]], "c": "b", "a": "DNA Polymerase δ"}, {"n": 6, "q": "Which of the following is a mechanism by which electrophilic hydroxyl radicals (•OH) react with DNA bases?", "o": [["a", "Intercalation between adjacent DNA base pairs"], ["b", "Formation of pyrimidine dimers between adjacent thymine bases"], ["c", "Methylation of cytosine residues at CpG islands"], ["d", "Addition to the double bonds of nitrogenous bases"]], "c": "d", "a": "Addition to the double bonds of nitrogenous bases"}, {"n": 7, "q": "Base excision repair (BER) is most active during which phase of the cell cycle?", "o": [["a", "G₁ phase"], ["b", "S phase"], ["c", "G₂ phase"], ["d", "M phase"]], "c": "a", "a": "G₁ phase"}, {"n": 8, "q": "In the Escherichia coli mismatch repair (MMR) pathway, which protein is responsible for recognizing base mismatches and small insertion/deletion loops (IDLs)?", "o": [["a", "MutH"], ["b", "MutL"], ["c", "MutS"], ["d", "UvrD"]], "c": "c", "a": "MutS"}, {"n": 9, "q": "A DNA adduct is best described as:", "o": [["a", "A double-strand break produced by ionizing radiation"], ["b", "A piece of DNA covalently bound to a chemical"], ["c", "A mismatch between complementary DNA bases"], ["d", "A DNA fragment generated during replication"]], "c": "b", "a": "A piece of DNA covalently bound to a chemical"}, {"n": 10, "q": "During the initial recognition of DNA lesions in global genome nucleotide excision repair (GG-NER), XPC forms a complex with Centrin2 and which other protein?", "o": [["a", "RPA"], ["b", "RAD23B"], ["c", "XPA"], ["d", "TFIIH"]], "c": "b", "a": "RAD23B"}]}, {"name": "Module 4", "qs": [{"n": 1, "q": "Chi (χ) sites are commonly referred to as recombination hotspots because they:", "o": [["a", "Prevent DNA replication from initiating"], ["b", "Increase the frequency of homologous recombination near their location"], ["c", "Promote DNA methylation at adjacent genes"], ["d", "Block the activity of the RecBCD complex"]], "c": "b", "a": "Increase the frequency of homologous recombination near their location"}, {"n": 2, "q": "Which of the following protein complexes is responsible for the initial recognition of DNA double-strand breaks during homologous recombination in eukaryotes?", "o": [["a", "MRN complex (MRE11–RAD50–NBS1)"], ["b", "MutS–MutL complex"], ["c", "XPC–RAD23B complex"], ["d", "Ku70/Ku80 complex"]], "c": "a", "a": "MRN complex (MRE11–RAD50–NBS1)"}, {"n": 3, "q": "Tyrosine and serine recombinases are subdivided based on which of the following criteria, respectively?", "o": [["a", "Catalytic mechanism; protein size"], ["b", "DNA-binding specificity; protein size"], ["c", "Subcellular localization; DNA sequence length"], ["d", "Recombination directionality; protein size"]], "c": "d", "a": "Recombination directionality; protein size"}, {"n": 4     if(C.done){C.ex=(isOp&&C.res!=='Error')?C.res:'';C.done=false}
    C.ex+=v;
  }else if(t==='bs'){if(C.done){C.done=false}C.ex=C.ex.replace(/(asin\(|acos\(|atan\(|sinh\(|cosh\(|tanh\(|sin\(|cos\(|tan\(|log\(|ln\(| mod |.)$/,'')}
  else if(t==='c'){C.ex='';C.res='0';C.done=false}
  else if(t==='neg'){C.ex=C.ex.startsWith('−(')&&C.ex.endsWith(')')?C.ex.slice(2,-1):'−('+C.ex+')';if(!C.ex.replace(/[−()]/g,''))C.ex=''}
  else if(t==='ans'){if(C.done){C.ex='';C.done=false}C.ex+=fmtNum(C.ans)}
  else if(t==='eq'){
    if(!C.ex)return;
    try{const r=calcEval(C.ex,C.deg);C.res=fmtNum(r);if(C.res!=='Error')C.ans=r}catch(e){C.res='Error'}
    C.done=true;
  }
  cshow();
}
function cmem(m){
  let cur=0;try{cur=C.res==='Error'?0:parseFloat(C.res)||0}catch(e){}
  if(m==='MC')C.mem=0;else if(m==='MR'){if(C.done){C.ex='';C.done=false}C.ex+=fmtNum(C.mem)}
  else if(m==='MS')C.mem=cur;else if(m==='M+')C.mem+=cur;else if(m==='M-')C.mem-=cur;
  cshow();
}
function toggleCalc(){const el=$('#calc');if(!el.dataset.b){buildCalc();el.dataset.b=1}el.style.display=el.style.display==='block'?'none':'block'}
