 L.innerHTML=d.rows.map((r,i)=>'<div class="lr'+(SESS&&r.name===SESS.name?' me':'')+'"><i>'+(i+1)+'</i><span>'+esc(r.name)+'</span><b>'+esc(r.score)+'</b><em>W'+esc(r.wave)+'</em></div>').join('')}
$('lb').onclick=showLB;$('lbx').onclick=()=>{hideAll();$('menu').style.display='flex'};
// auth panel
let amode='login';
function setMode(m){amode=m;document.querySelectorAll('#atabs button').forEach(b=>b.classList.toggle('act',b.dataset.m===m));
 $('anm').style.display=m==='signup'?'':'none';$('asub').textContent=m==='signup'?'CREATE ACCOUNT':'SIGN IN';
 $('apw').placeholder=m==='signup'?'Password (8+ characters)':'Password';$('apw').autocomplete=m==='signup'?'new-password':'current-password';$('aerr').textContent=''}
function showAuth(){hideAll();setMode('login');$('authp').style.display='flex';$('aem').focus()}
$('atabs').onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
$('ax2').onclick=()=>{hideAll();$('menu').style.display='flex'};
async function doAuth(){const b=$('asub'),er=$('aerr'),email=$('aem').value.trim(),pw=$('apw').value;
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){er.textContent='Enter a valid email address.';return}
 if(amode==='signup'&&pw.length<8){er.textContent='Password must be at least 8 characters.';return}
 if(!pw){er.textContent='Enter your password.';return}
 if(amode==='signup'){const ne=nameCheck($('anm').value);if(ne){er.textContent=ne;return}}
 b.disabled=true;er.textContent=amode==='signup'?'Creating account...':'Signing in...';
 const r=await api(ACC_URL,{action:amode,email,password:pw,name:$('anm').value.trim()});b.disabled=false;
 if(!r.ok){er.textContent=r.error||'Something went wrong.';return}
 SESS={token:r.token,name:r.name,email};try{localStorage.setItem('va-sess',JSON.stringify(SESS))}catch(e){}
 mergeSt(r.state);$('apw').value='';sv();hideAll();$('menu').style.display='flex';buildHome('Signed in as '+r.name+'.'+(isEmbs()?' EMBS Jumpsuit skin unlocked!':''))}
$('asub').onclick=doAuth;['aem','anm','apw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')doAuth()}));
reset();buildHome();requestAnimationFrame(loop);
})();
